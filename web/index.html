          <div style="padding:20px">
            <p style="margin-bottom:12px">
              第 <strong x-text="currentChapter ? currentChapter.order + 1 : '?'"></strong> 章
              《<strong x-text="currentChapter ? currentChapter.title : ''"></strong>》
              当前 <strong x-text="currentChapter ? (currentChapter.word_count || 0) : 0"></strong> 字。
            </p>
            <p style="margin-bottom:12px">
              将根据本章已生成的<b>细纲</b>和<b>评审报告</b>，由 LLM 重新生成正文，<b style="color:#dc2626">覆盖现有正文</b>。
            </p>
            <p style="margin-bottom:16px;color:var(--text-muted);font-size:13px;background:#fef3c7;padding:8px 10px;border-radius:4px">
              💾 旧版正文会作为新版本存入废纸篓，可在「章节版本」中回滚。
            </p>
            <div style="display:flex;justify-content:flex-end;gap:8px">
              <button class="btn-secondary" @click="showReviseConfirmModal = false">取消</button>
              <button class="btn-primary" @click="runRevise()">确认修订</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 一键生成（覆盖已有章节）确认浮层 ═══ -->
    <template x-if="showRegenerateConfirmModal">
      <div class="modal-overlay" @click.self="cancelRegenerateExisting()">
        <div class="modal" style="max-width:460px">
          <header class="pipeline-header">
            <h3>⚠️ 章节已有正文</h3>
            <button class="modal-close-x" @click="cancelRegenerateExisting()">×</button>
          </header>
          <div style="padding:20px">
            <p style="margin-bottom:12px">
              第 <strong x-text="currentChapter ? currentChapter.order + 1 : '?'"></strong> 章
              《<strong x-text="currentChapter ? currentChapter.title : ''"></strong>》
              已有 <strong x-text="currentChapter ? (currentChapter.word_count || 0) : 0"></strong> 字正文。
            </p>
            <p style="margin-bottom:12px">
              继续 <b>一键生成</b> 将走完整 9 步流水线（细纲 → 正文 → 评审 → 修订），<b style="color:#dc2626">覆盖现有正文和细纲</b>。
            </p>
            <p style="margin-bottom:16px;color:var(--text-muted);font-size:13px;background:#fef3c7;padding:8px 10px;border-radius:4px">
              💾 当前正文的快照会作为新版本存入废纸篓，可在「章节版本」中回滚。<br>
              如果只想基于现有细纲/评审重写正文，建议用「📝 修订」按钮。
            </p>
            <div style="display:flex;justify-content:flex-end;gap:8px">
              <button class="btn-secondary" @click="cancelRegenerateExisting()">取消</button>
              <button class="btn-primary" @click="confirmRegenerateExisting()">确认覆盖生成</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 字数调整确认浮层 ═══ -->
    <template x-if="showWordAdjustModal">
      <div class="modal-overlay" @click.self="closeWordAdjustModal()">
        <div class="modal" style="max-width:480px">
          <header class="pipeline-header">
            <h3>📐 字数调整</h3>
            <button class="modal-close-x" @click="closeWordAdjustModal()">×</button>
          </header>
          <div style="padding:20px">
            <p style="margin-bottom:12px">
              第 <strong x-text="currentChapter ? currentChapter.order + 1 : '?'"></strong> 章
              《<strong x-text="currentChapter ? currentChapter.title : ''"></strong>》
            </p>

            <!-- 字数现状信息 -->
            <div style="background:#f8fafc;border-radius:6px;padding:12px;margin-bottom:14px">
              <div style="display:flex;justify-content:space-between;font-size:13px">
                <span>当前字数</span>
                <strong x-text="(currentChapter && currentChapter.word_count) || 0"></strong>
              </div>
            </div>

            <!-- 自定义字数上下限（输入框默认填项目设定值，方便直接修改） -->
            <div style="border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:14px">
              <div style="font-size:12px;font-weight:600;color:#475569;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
                <span>调整范围（默认填项目设定）</span>
                <label style="display:flex;align-items:center;gap:4px;font-weight:normal;cursor:pointer">
                  <input type="checkbox" x-model="wordAdjustUseCustom"
                         @change="recalcWordAdjustPlan()">
                  <span style="font-size:12px">自定义</span>
                </label>
              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
                <div>
                  <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:2px">下限（min）</label>
                  <input type="number" min="0" step="100"
                         x-model.number="wordAdjustCustomMin"
                         @input="recalcWordAdjustPlan()"
                         style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px">
                </div>
                <div>
                  <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:2px">目标（target）</label>
                  <input type="number" min="0" step="100"
                         x-model.number="wordAdjustCustomTarget"
                         @input="recalcWordAdjustPlan()"
                         style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px">
                </div>
                <div>
                  <label style="font-size:11px;color:var(--text-muted);display:block;margin-bottom:2px">上限（max）</label>
                  <input type="number" min="0" step="100"
                         x-model.number="wordAdjustCustomMax"
                         @input="recalcWordAdjustPlan()"
                         style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:4px;font-size:13px">
                </div>
              </div>

              <!-- 按目标字数百分比快捷设置 -->
              <div style="margin-top:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span style="font-size:11px;color:var(--text-muted)">按目标 ±</span>
                <template x-for="pct in [5, 10, 15, 20, 30]" :key="pct">
                  <button type="button" class="btn-tiny" style="font-size:11px"
                          @click="applyWordAdjustPctPreset(pct)"
                          x-text="`${pct}%`"></button>
                </template>
                <input type="number" min="1" max="100" step="1"
                       x-model.number="wordAdjustPctInput"
                       placeholder="自定义%"
                       style="width:70px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px">
                <span style="font-size:11px;color:var(--text-muted)">%</span>
                <button type="button" class="btn-tiny" style="font-size:11px"
                        @click="applyWordAdjustPctPreset(wordAdjustPctInput)">应用</button>
                <span style="font-size:11px;color:var(--text-muted);flex:1;text-align:right">
                  将在当前 target 的 ±<span x-text="wordAdjustPctInput || 10"></span>% 区间内调整
                </span>
              </div>

              <p style="font-size:11px;color:var(--text-muted);margin-top:8px">
                💡 留空 = 用项目默认 min/target/max。点 ±% 按钮可一键以 target 为中心扩展区间。
              </p>
            </div>

            <!-- 动作提示 -->
            <template x-if="wordAdjustPlan">
              <div style="background:#fef3c7;padding:10px 12px;border-radius:4px;margin-bottom:14px;font-size:13px">
                <div style="margin-bottom:6px;color:#475569">
                  📐 当前生效区间：<strong x-text="wordAdjustPlan.min"></strong> ~ <strong x-text="wordAdjustPlan.max"></strong> 字
                  <span style="font-size:11px;color:var(--text-muted)" x-text="wordAdjustUseCustom ? '（自定义）' : '（项目默认）'"></span>
                </div>
                <template x-if="wordAdjustPlan.action === 'compress'">
                  <div>
                    📉 当前超出上限 <strong x-text="wordAdjustPlan.delta"></strong> 字，将调用 LLM <b>缩写</b>。
                  </div>
                </template>
                <template x-if="wordAdjustPlan.action === 'expand'">
                  <div>
                    📈 当前低于下限 <strong x-text="wordAdjustPlan.delta"></strong> 字，将调用 LLM <b>扩写</b>。
                  </div>
                </template>
                <template x-if="wordAdjustPlan.action === 'none'">
                  <div style="color:#10b981">
                    ✅ 当前字数已在区间内，<b>无需调整</b>。
                  </div>
                </template>
              </div>
            </template>

            <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">
              ⚠️ 旧版正文会作为新版本存入废纸篓，可在「章节版本」中回滚。本操作<strong>不会</strong>修改细纲或评审。
            </p>

            <div style="display:flex;justify-content:flex-end;gap:8px">
              <button class="btn-secondary" @click="closeWordAdjustModal()">取消</button>
              <button class="btn-primary"
                      :disabled="!wordAdjustPlan || wordAdjustPlan.action === 'none' || wordAdjustSubmitting"
                      @click="runWordAdjust()">
                <span x-show="!wordAdjustSubmitting">确认调整</span>
                <span x-show="wordAdjustSubmitting">调整中…</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 章节生成 9 步流水线进度面板 ═══ -->
    <template x-if="showPipelineProgress">
      <div class="modal-overlay" @click.self="closePipelinePanel(false)">
        <div class="modal modal-wide">
          <header class="pipeline-header">
            <h3>
              <span>🤖 章节生成流水线（第 </span>
              <span x-text="currentChapter ? currentChapter.order + 1 : '?'"></span>
              <span> 章）</span>
            </h3>
            <button class="modal-close-x" @click="closePipelinePanel(false)" :disabled="pipelineTask && !pipelineTaskDone">×</button>
          </header>

          <!-- 总体进度条 -->
          <div class="pipeline-overall">
            <div class="progress-bar-track">
              <div class="progress-bar-fill" :style="`width: ${pipelineProgressPct}%`"></div>
            </div>
            <div class="pipeline-overall-text">
              <span x-text="`${pipelineProgressPct}% · ${pipelineElapsedText}`"></span>
              <span class="status-pill" :class="`status-${pipelineStatus}`" x-text="{
                pending: '等待',
                running: '运行中',
                completed: '已完成',
                failed: '失败',
                cancelled: '已取消'
              }[pipelineStatus] || pipelineStatus"></span>
            </div>
          </div>

          <!-- 9 步任务清单 -->
          <div class="pipeline-stages">
            <template x-for="stage in pipelineStagesView" :key="stage.id">
              <div class="pipeline-stage" :class="`stage-${stage.status}`">
                <div class="stage-marker">
                  <span class="stage-num" x-text="stage.id.split('_')[0]"></span>
                  <span class="stage-icon" x-text="{
                    pending: '○',
                    running: '⏳',
                    completed: '✅',
                    failed: '❌',
                    skipped: '⏭'
                  }[stage.status] || '○'"></span>
                </div>
                <div class="stage-body">
                  <div class="stage-label">
                    <span x-text="stage.label"></span>
                    <span class="stage-elapsed" x-show="stage.status === 'running' && stage.duration_ms === null"
                          x-text="`(已 ${stage.elapsed_display}s)`"></span>
                    <span class="stage-elapsed" x-show="stage.duration_ms !== null"
                          x-text="`(${stage.duration_display}s)`"></span>
                  </div>
                  <div class="stage-bar" x-show="stage.status === 'running' || stage.status === 'completed'">
                    <div class="stage-bar-fill"
                         :style="`width: ${stage.status === 'completed' ? 100 : stage.elapsed_pct}%`"></div>
                  </div>
                  <div class="stage-error" x-show="stage.error" x-text="stage.error"></div>
                </div>
              </div>
            </template>
          </div>

          <!-- 完成后显示的字数 / 评审信息 -->
          <template x-if="pipelineStatus === 'completed' && pipelineFinalResult">
            <div class="pipeline-result">
              <span>✅ 章节生成完成 · 共 <strong x-text="pipelineFinalResult.final_word_count"></strong> 字</span>
            </div>
          </template>
          <template x-if="pipelineStatus === 'failed'">
            <div class="pipeline-result pipeline-failed">
              <span>❌ 流水线中断：<span x-text="pipelineTask && pipelineTask.error"></span></span>
            </div>
          </template>

          <footer class="pipeline-footer">
            <button class="btn-secondary" @click="closePipelinePanel(false)"
                    :disabled="pipelineTask && !pipelineTaskDone && pipelineStatus !== 'cancelled' && pipelineStatus !== 'failed'">
              关闭
            </button>
            <button class="btn-primary" @click="onPipelineCompletedAndClose()"
                    x-show="pipelineStatus === 'completed'">
              📖 回到章节查看
            </button>
          </footer>
        </div>
      </div>
    </template>

    <!-- ═══ 项目设置弹窗 ═══ -->
    <template x-if="showProjectSettings">
      <div class="modal-overlay" @click.self="showProjectSettings = false">
        <div class="modal modal-wide">
          <h3>⚙️ 项目设置</h3>
          <template x-if="currentProject">
            <div class="settings-form">
              <div class="setting-row">
                <label>写作风格</label>
                <select x-model="currentProject.writing_style">
                  <option value="优美">优美</option>
                  <option value="幽默">幽默</option>
                  <option value="冷峻">冷峻</option>
                  <option value="平实">平实</option>
                  <option value="诗意">诗意</option>
                </select>
              </div>
              <div class="setting-row">
                <label>去 AI 味</label>
                <div class="toggle-row">
                  <label class="toggle-switch">
                    <input type="checkbox" :checked="currentProject.ai味去除程度 > 0" @change="currentProject.ai味去除程度 = $event.target.checked ? 8 : 0">
                    <span class="toggle-slider"></span>
                  </label>
                  <span x-text="currentProject.ai味去除程度 > 0 ? '已开启（自动去除AI痕迹）' : '已关闭'"></span>
                </div>
                <p class="hint">开启后，生成内容会自动去除AI写作痕迹</p>
              </div>
              <div class="setting-row">
                <label>每章目标字数</label>
                <input type="number" x-model="currentProject.target_word_count">
              </div>
              <div class="setting-row">
                <label>字数下限</label>
                <input type="number" x-model="currentProject.word_count_min">
              </div>
              <div class="setting-row">
                <label>字数上限</label>
                <input type="number" x-model="currentProject.word_count_max">
              </div>
            </div>
          </template>
          <div class="modal-actions">
            <button class="btn-secondary" @click="showProjectSettings = false">取消</button>
            <button class="btn-primary" @click="saveProjectSettings()">保存</button>
            <template x-if="currentProject">
              <button class="btn-danger" @click="deleteCurrentProject()">🗑️ 删除项目</button>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 任务管理弹窗 ═══ -->
    <template x-if="showTaskManager">
      <div class="modal-overlay" @click.self="showTaskManager = false">
        <div class="modal modal-wide">
          <h2>📋 任务管理</h2>
          <div class="task-manager-summary">
            <span>共 <strong x-text="allTasks.length"></strong> 个任务</span>
            <span>进行中 <strong x-text="activeTaskCount"></strong></span>
            <span>已完成 <strong x-text="completedTaskCount"></strong></span>
          </div>
          <div class="task-manager-actions">
            <button class="btn-primary" @click="refreshAllTasks()">🔄 刷新</button>
            <!-- 只有列表里有失败/取消的 bootstrap 任务时启用"重跑失败" -->
            <button class="btn-primary"
                    @click="rerunAllBootstrapTasks(false)"
                    :disabled="!hasFailedBootstrapTasks">
              🔄 重跑失败项
            </button>
            <!-- 有任意 bootstrap 任务时可重跑全部设定 -->
            <button class="btn-primary"
                    @click="rerunAllBootstrapTasks(true)"
                    :disabled="!hasBootstrapTasks">
              🔄 重跑全部设定
            </button>
            <button class="btn-danger" @click="terminateAllTasks()"
                    :disabled="activeTaskCount === 0">
              ⛔ 终止全部任务
            </button>
            <button class="btn-secondary" @click="showTaskManager = false">关闭</button>
          </div>
          <div class="task-list">
            <template x-if="allTasks.length === 0">
              <p class="empty-hint">暂无任务</p>
            </template>
            <template x-for="t in allTasks" :key="t.id">
              <div class="task-item" :class="`task-${t.status}`">
                <div class="task-info">
                  <div class="task-desc" x-text="t.description"></div>
                  <div class="task-meta">
                    <span class="task-type" x-text="t.task_type"></span>
                    <span class="task-id" x-text="t.id"></span>
                    <span class="task-duration" x-text="`${t.duration_s}s`"></span>
                    <!-- 流水线/修订任务：展开/收起子任务详情 -->
                    <button class="btn-tiny"
                            x-show="(t.task_type === 'chapter_pipeline' || t.task_type === 'chapter_revise') && t.result && t.result.stages"
                            @click="toggleTaskDetail(t.id)">
                      <span x-text="expandedTaskIds.includes(t.id) ? '▾ 收起子任务' : '▸ 展开子任务'"></span>
                    </button>
                  </div>
                  <template x-if="t.error">
                    <div class="task-error" x-text="t.error"></div>
                  </template>

                  <!-- 流水线/修订子任务详情 -->
                  <template x-if="(t.task_type === 'chapter_pipeline' || t.task_type === 'chapter_revise') && t.result && t.result.stages && expandedTaskIds.includes(t.id)">
                    <div class="task-pipeline-detail">
                      <div class="tpd-overall">
                        <span x-text="`总进度: ${(t.result.progress_pct || 0)}%`"></span>
                        <span x-text="t.result.current_stage ? `· 当前: ${getStageLabel(t.result.current_stage)}` : ''"></span>
                        <span x-show="t.result.total_duration_ms" x-text="`· 总耗时: ${(t.result.total_duration_ms/1000).toFixed(1)}s`"></span>
                      </div>
                      <div class="tpd-stages">
                        <template x-for="[sid, sinfo] in Object.entries(t.result.stages)" :key="sid">
                          <div class="tpd-stage" :class="`stage-${sinfo.status}`">
                            <span class="tpd-icon" x-text="{
                              pending: '○',
                              running: '⏳',
                              completed: '✅',
                              failed: '❌'
                            }[sinfo.status] || '○'"></span>
                            <span class="tpd-label" x-text="sinfo.label || sid"></span>
                            <span class="tpd-score" x-show="sinfo.score"
                                  x-text="`(${sinfo.score?.toFixed(1) || '-'}/100)`"></span>
                            <span class="tpd-time" x-show="sinfo.duration_ms !== null && sinfo.duration_ms !== undefined"
                                  x-text="`${(sinfo.duration_ms/1000).toFixed(1)}s`"></span>
                            <span class="tpd-err" x-show="sinfo.error" x-text="sinfo.error"></span>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>
                </div>
                <div class="task-status">
                  <span class="status-pill" :class="`status-${t.status}`" x-text="{
                    pending: '等待',
                    running: '运行中',
                    completed: '完成',
                    failed: '失败',
                    cancelled: '已取消'
                  }[t.status] || t.status"></span>
                  <!--
                    bootstrap 任务的「重新生成」按钮：仅失败/取消时显示。
                    已完成的 bootstrap 任务不在此显示「重新生成」按钮，
                    因为用户在任务清单看不到生成内容，无法判断是否需要重生成。
                    想要重新生成已成功的 stage，请到「大纲」面板的 AI 生成设定区域。
                  -->
                  <button class="btn-small btn-rerun"
                          x-show="t.task_type === 'bootstrap' && ['failed', 'cancelled'].includes(t.status) && t.run_id"
                          @click="rerunOneBootstrapTask(t)">
                    🔄 重新生成
                  </button>
                  <!-- 流水线任务 → 直接打开流水线面板（实时进度） -->
                  <button class="btn-small"
                          x-show="t.task_type === 'chapter_pipeline' && ['pending','running','failed'].includes(t.status)"
                          @click="openPipelinePanelForTask(t)">
                    📊 查看进度
                  </button>
                  <button class="btn-small" x-show="['pending','running'].includes(t.status)"
                          @click="terminateOneTask(t.id)">⛔ 终止</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 全局设置弹窗 ═══ -->
    <template x-if="showSettings">
      <div class="modal-overlay" @click.self="showSettings = false">
        <div class="modal" style="max-width: 680px; max-height: 85vh; overflow-y: auto;">
          <h3>🔧 全局设置 — 服务商管理</h3>

          <!-- 新增服务商表单 -->
          <template x-if="showAddProvider">

              <div class="setting-row">
                <label>服务商 ID（英文 slug）</label>
                <input type="text" x-model="providerForm.id" placeholder="my-provider" style="width:100%">
              </div>
              <div class="setting-row">
                <label>显示名称</label>
                <input type="text" x-model="providerForm.name" placeholder="我的服务商" style="width:100%">
              </div>
              <div class="setting-row">
                <label>API Key</label>
                <input type="password" x-model="providerForm.api_key" placeholder="sk-..." style="width:100%">
              </div>
              <div class="setting-row">
                <label>Base URL</label>
                <input type="text" x-model="providerForm.base_url" placeholder="https://api.example.com/v1" style="width:100%">
              </div>
              <div class="setting-row">
                <label>默认模型</label>
                <input type="text" x-model="providerForm.model" placeholder="model-name" style="width:100%">
              </div>
              <div class="modal-actions" style="margin-top: 12px;">
                <button class="btn-secondary" @click="cancelAddProvider()">取消</button>
                <button class="btn-primary" @click="createProvider()" :disabled="providerSaving">
                  <span x-show="!providerSaving">创建</span>
                  <span x-show="providerSaving">保存中...</span>
                </button>
              </div>
            </div>
          </template>

          <!-- 服务商列表 -->
          <div class="settings-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
              <span style="font-weight: 600; color: #374151;">服务商列表</span>
              <button class="btn-icon" @click="startAddProvider()" title="新增服务商" style="font-size: 18px;">➕</button>
            </div>

            <template x-for="p in providers" :key="p.id">
              <div style="border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 8px;"
                   :style="p.is_default ? 'border-color: #3b82f6; background: #f8faff;' : ''">
                <!-- 查看模式 -->
                <template x-if="editingProvider !== p.id">
                  <div>
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                      <div>
                        <span style="font-weight: 600;" x-text="p.name"></span>
                        <span style="font-size: 12px; color: #6b7280; margin-left: 8px;" x-text="'(' + p.id + ')'"></span>
                        <span x-show="p.is_default" style="background: #3b67f6; color: white; font-size: 12px; padding: 2px 6px; border-radius: 4px; margin-left: 8px;">正在使用</span>
                      </div>
                      <div style="display: flex; gap: 6px;">
                        <button class="btn-icon" @click="startEditProvider(p)" title="编辑" style="font-size: 14px;">✏️ 编辑</button>
                        <button class="btn-icon" @click="setDefaultProvider(p.id)" x-show="!p.is_default" title="设为默认" style="font-size: 14px;">🔵 选用</button>
                        <button class="btn-icon" @click="deleteProvider(p.id)" x-show="!p.is_default" title="删除" style="font-size: 14px;">🗑️ 删除</button>
                      </div>
                    </div>
                    <div style="font-size: 13px; color: #6b7280; margin-top: 6px;">
                      <span x-show="p.base_url" x-text="'URL: ' + p.base_url"></span>
                      <span x-show="p.model" x-text="' · 模型: ' + p.model"></span>
                      <span x-show="p.has_api_key" style="color: #10b981;">（🔑 已配置 Key）</span>
                      <span x-show="!p.has_api_key" style="color: #f59e0b;">（⚠️ 未配置 Key）</span>
                    </div>
                  </div>
                </template>

                <!-- 编辑模式 -->
                <template x-if="editingProvider === p.id">
                  <div>
                    <div style="font-weight: 600; margin-bottom: 10px;">
                      ✏️ 编辑：<span x-text="p.name"></span>
                    </div>
                    <div class="setting-row">
                      <label>显示名称</label>
                      <input type="text" x-model="providerForm.name" style="width:100%">
                    </div>
                    <div class="setting-row">
                      <label>API Key <span style="font-size: 12px; color: #9ca3af;" x-text="p.has_api_key ? '(已有，留空则不修改)' : '(未配置)'"></span></label>
                      <input type="password" x-model="providerForm.api_key" placeholder="留空则不修改" style="width:100%">
                    </div>
                    <div class="setting-row">
                      <label>Base URL</label>
                      <input type="text" x-model="providerForm.base_url" style="width:100%">
                    </div>
                    <div class="setting-row">
                      <label>默认模型</label>
                      <input type="text" x-model="providerForm.model" style="width:100%">
                    </div>
                    <div class="modal-actions" style="margin-top: 10px;">
                      <button class="btn-secondary" @click="cancelEditProvider()">取消</button>
                      <button class="btn-primary" @click="saveProviderEdit()" :disabled="providerSaving">
                        <span x-show="!providerSaving">保存</span>
                        <span x-show="providerSaving">保存中...</span>
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <div x-show="providers.length === 0" style="text-align: center; color: #9ca3af; padding: 20px;">
              暂无服务商，点击上方 ➕ 添加
            </div>
          </div>

          <div class="modal-actions">
            <button class="btn-secondary" @click="showSettings = false">关闭</button>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 创建项目表单（4 必填 + 8 选填） ═══ -->
    <template x-if="showCreateProjectModal">
      <div class="modal-overlay modal-locked">
        <div class="modal modal-wide">
          <button class="modal-close-x" @click="confirmCloseCreateProject()" data-tip="关闭">×</button>
          <h2>📖 创建新项目</h2>
          <p class="modal-hint">仅 4 项必填，其余 8 项留空可由 AI 智能补全（推荐）</p>

          <form @submit.prevent="submitCreateProject(true)">
            <!-- 必填区块 -->
            <fieldset class="form-section required">
              <legend>必填（4 项）</legend>

              <div class="form-row">
                <label>
                  <span class="req">*</span> 书名
                  <input type="text" x-model="newProjectForm.title" placeholder="例如：无名" required>
                </label>
                <label>
                  <span class="req">*</span> 章节字数（千字）
                  <select x-model.number="newProjectForm.chapter_word_count" required>
                    <template x-for="n in createFormOptions.chapter_word_options" :key="n">
                      <option :value="n" x-text="n + ' 千字（约 ' + (n*1000) + ' 字/章）'"></option>
                    </template>
                  </select>
                </label>
                <label>
                  预计总章数
                  <input type="number" x-model.number="newProjectForm.total_chapters" min="1" max="10000" placeholder="100">
                </label>
              </div>

              <div class="form-row">
                <label>
                  <span class="req">*</span> 题材（可多选，至少 1 个）
                  <!-- 已选题材 chips -->
                  <div class="genre-chips" x-show="newProjectForm.genres.length > 0">
                    <template x-for="g in newProjectForm.genres" :key="g">
                      <span class="genre-chip">
                        <span x-text="g"></span>
                        <button class="chip-x" @click="removeGenre(g)">×</button>
                      </span>
                    </template>
                  </div>
                  <!-- 候选下拉（系统 + 用户自定义） -->
                  <div class="genre-picker">
                    <select @change="addGenreToNewProject($event)">
                      <option value="">+ 添加题材...</option>
                      <template x-for="g in genreList" :key="g.id">
                        <option :value="g.name" x-text="g.name + (g.is_system ? '' : ' (自定义)')"></option>
                      </template>
                    </select>
                    <!-- 用户自添加 -->
                    <div class="genre-custom-row">
                      <input type="text" x-model="newGenreInput"
                             @keydown.enter.prevent="submitNewGenre()"
                             placeholder="自定义新题材后回车">
                      <button class="btn-small" @click="submitNewGenre()">+</button>
                    </div>
                  </div>
                </label>
              </div>

              <label>
                <span class="req">*</span> 创意信息（一句话描述故事）
                <textarea x-model="newProjectForm.description" rows="3"
                          placeholder="例如：一个少年寻找失踪妹妹的玄幻冒险故事..."
                          required></textarea>
              </label>
            </fieldset>

            <!-- 选填区块 -->
            <fieldset class="form-section optional">
              <legend>选填（8 项 · 未填将由 AI 补全）</legend>

              <div class="form-row">
                <label>
                  <span class="ai-tag" title="AI 补全">🤖</span> 核心主题
                  <input type="text" x-model="newProjectForm.theme" placeholder="如：救赎、成长、复仇...">
                </label>
                <label>
                  <span class="ai-tag" title="AI 补全">🤖</span> 基调
                  <select x-model="newProjectForm.tone">
                    <option value="">-- AI 补全 --</option>
                    <template x-for="t in createFormOptions.tones" :key="t">
                      <option :value="t" x-text="t"></option>
                    </template>
                  </select>
                </label>
              </div>

              <div class="form-row">
                <label>
                  <span class="ai-tag" title="AI 补全">🤖</span> 文风
                  <select x-model="newProjectForm.style">
                    <option value="">-- AI 补全 --</option>
                    <template x-for="s in createFormOptions.styles" :key="s">
                      <option :value="s" x-text="s"></option>
                    </template>
                  </select>
                </label>
                <label>
                  <span class="ai-tag" title="AI 补全">🤖</span> 节奏
                  <select x-model="newProjectForm.pacing">
                    <option value="">-- AI 补全 --</option>
                    <template x-for="p in createFormOptions.pacings" :key="p">
                      <option :value="p" x-text="p"></option>
                    </template>
                  </select>
                </label>
              </div>

              <label>
                <span class="ai-tag" title="AI 补全">🤖</span> 世界观 / 背景
                <textarea x-model="newProjectForm.premise" rows="2"
                          placeholder="时代 / 世界 / 社会规则 / 势力等..."></textarea>
              </label>

              <div class="form-row">
                <label>
                  <span class="ai-tag" title="AI 补全">🤖</span> 主角（名字/性格/目标）
                  <textarea x-model="newProjectForm.protagonist" rows="2"
                            placeholder="例：江寻，16岁少年，性格倔强..."></textarea>
                </label>
                <label>
                  <span class="ai-tag" title="AI 补全">🤖</span> 反派
                  <textarea x-model="newProjectForm.antagonist" rows="2"
                            placeholder="目标、核心矛盾..."></textarea>
                </label>
              </div>

              <label>
                <span class="ai-tag" title="AI 补全">🤖</span> 配角
                <textarea x-model="newProjectForm.supporting" rows="2"
                          placeholder="重要配角及与主角的关系..."></textarea>
              </label>

              <label>
                <span class="ai-tag" title="AI 补全">🤖</span> 其他备注
                <textarea x-model="newProjectForm.notes" rows="2"
                          placeholder="独特设定、脑洞、想表达的主旨..."></textarea>
              </label>
            </fieldset>

            <div class="modal-actions">
              <button type="button" class="btn-secondary" @click="confirmCloseCreateProject()">取消</button>
              <button type="submit" class="btn-primary">🚀 开始创建（AI 补全未填项）</button>
            </div>
          </form>
        </div>
      </div>
    </template>

    <!-- ──── 预览面板 ──── -->
    <template x-if="activePanel === 'preview' && currentProject">
      <div class="panel-page preview-panel">
        <!-- 通栏章节信息 -->
        <div class="preview-chapter-banner">
          <div class="pcb-main">
            <h2 x-text="previewChapter ? `第 ${previewChapter.order + 1} 章 · ${previewChapter.title}` : '请选择章节'"></h2>
            <span class="pcb-meta" x-show="previewChapter">
              <span x-text="(previewChapter?.word_count || 0) + ' 字'"></span>
              <span>·</span>
              <span x-text="'创建于 ' + (previewChapter?.created_at || '').slice(0,10)"></span>
              <span x-show="previewReview">·</span>
              <span x-show="previewReview" class="pcb-score">评分: <strong x-text="previewReview?.overall_score?.toFixed(1) || '-'"></strong> / 100</span>
            </span>
          </div>
          <div class="pcb-actions">
            <button class="btn-secondary" @click="openPreview(previewChapter)" :disabled="!previewChapter">刷新</button>
          </div>
        </div>

        <!-- 章节选择（无预览章节时） -->
        <template x-if="!previewChapter">
          <div class="preview-select">
            <p>点击章节列表中的章节，或从下方选择：</p>
            <div class="preview-chapter-grid">
              <template x-for="ch in chapters" :key="ch.id">
                <div class="preview-ch-card" @click="openPreview(ch)">
                  <strong x-text="`${ch.order + 1}. ${ch.title}`"></strong>
                  <span x-text="`${ch.word_count} 字`"></span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- 标签页 + 内容 -->
        <template x-if="previewChapter">
          <div class="preview-body">
            <div class="preview-tabs">
              <button :class="{ active: previewSubTab === 'content' }" @click="previewSubTab = 'content'">📖 正文</button>
              <button :class="{ active: previewSubTab === 'outline' }" @click="previewSubTab = 'outline'">📋 细纲</button>
              <button :class="{ active: previewSubTab === 'review' }" @click="previewSubTab = 'review'">📊 评审报告</button>
              <button :class="{ active: previewSubTab === 'foreshadow' }" @click="previewSubTab = 'foreshadow'">🔗 伏笔情况</button>
            </div>

            <!-- 正文 -->
            <div x-show="previewSubTab === 'content'" class="preview-content-body">
              <template x-if="previewChapter.content">
                <div class="reader-text">
                  <template x-for="(para, i) in (previewChapter.content || '').split('\n').filter(p => p.trim())" :key="i">
                    <p x-text="para"></p>
                  </template>
                </div>
              </template>
              <template x-if="!previewChapter.content">
                <p class="preview-empty">暂无正文内容</p>
              </template>
            </div>

            <!-- 细纲 -->
            <div x-show="previewSubTab === 'outline'" class="preview-outline-body">
              <template x-if="chapterOutlinesMap[previewChapter.id]">
                <div class="outline-detail">
                  <div class="outline-meta-grid">
                    <div class="omg-item"><span>位置</span><strong x-text="chapterOutlinesMap[previewChapter.id].chapter_position || '-'"></strong></div>
                    <div class="omg-item"><span>节拍</span><strong x-text="chapterOutlinesMap[previewChapter.id].pacing || '-'"></strong></div>
                    <div class="omg-item"><span>字数目标</span><strong x-text="(chapterOutlinesMap[previewChapter.id].target_word_count || 0) + ' 字'"></strong></div>
                    <div class="omg-item"><span>状态</span><strong x-text="chapterOutlinesMap[previewChapter.id].status || '-'"></strong></div>
                  </div>
                  <div class="outline-section">
                    <h4>核心内容</h4>
                    <div class="outline-text" x-text="chapterOutlinesMap[previewChapter.id].key_content || '暂无'"></div>
                  </div>
                  <div class="outline-section">
                    <h4>剧情推进</h4>
                    <div class="outline-text" x-text="chapterOutlinesMap[previewChapter.id].plot_advance || '暂无'"></div>
                  </div>
                  <template x-if="(chapterOutlinesMap[previewChapter.id].conflicts || []).length > 0">
                    <div class="outline-section">
                      <h4>冲突</h4>
                      <ul>
                        <template x-for="(c, i) in chapterOutlinesMap[previewChapter.id].conflicts" :key="i">
                          <li x-text="c"></li>
                        </template>
                      </ul>
                    </div>
                  </template>
                  <template x-if="(chapterOutlinesMap[previewChapter.id].highlights || []).length > 0">
                    <div class="outline-section">
                      <h4>亮点</h4>
                      <ul>
                        <template x-for="(h, i) in chapterOutlinesMap[previewChapter.id].highlights" :key="i">
                          <li x-text="h"></li>
                        </template>
                      </ul>
                    </div>
                  </template>
                  <template x-if="chapterOutlinesMap[previewChapter.id].foreshadow_notes">
                    <div class="outline-section">
                      <h4>伏笔说明</h4>
                      <div class="outline-text" x-text="chapterOutlinesMap[previewChapter.id].foreshadow_notes"></div>
                    </div>
                  </template>
                  <template x-if="chapterOutlinesMap[previewChapter.id].notes">
                    <div class="outline-section">
                      <h4>备注</h4>
                      <div class="outline-text" x-text="chapterOutlinesMap[previewChapter.id].notes"></div>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="!chapterOutlinesMap[previewChapter.id]">
                <p class="preview-empty">暂无细纲</p>
              </template>
            </div>

            <!-- 评审报告 -->
            <div x-show="previewSubTab === 'review'" class="preview-review-body">
              <template x-if="previewReview">
                <div class="review-result">
                  <div class="review-scores">
                    <div class="score-item"><span>一致性</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_consistency * 10}%`"></div></div><strong x-text="previewReview.score_consistency.toFixed(1)"></strong></div>
                    <div class="score-item"><span>节奏</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_pacing * 10}%`"></div></div><strong x-text="previewReview.score_pacing.toFixed(1)"></strong></div>
                    <div class="score-item"><span>文笔风格</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_style * 10}%`"></div></div><strong x-text="previewReview.score_style.toFixed(1)"></strong></div>
                    <div class="score-item"><span>去AI味</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_ai_removal * 10}%`"></div></div><strong x-text="previewReview.score_ai_removal.toFixed(1)"></strong></div>
                    <div class="score-item"><span>字数合规</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_word_count * 10}%`"></div></div><strong x-text="previewReview.score_word_count.toFixed(1)"></strong></div>
                    <div class="score-item"><span>伏笔管理</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_foreshadowing * 10}%`"></div></div><strong x-text="previewReview.score_foreshadowing.toFixed(1)"></strong></div>
                    <div class="score-item"><span>角色弧光</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_character_arc * 10}%`"></div></div><strong x-text="previewReview.score_character_arc.toFixed(1)"></strong></div>
                    <div class="score-item"><span>主旨契合</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_thematic * 10}%`"></div></div><strong x-text="previewReview.score_thematic.toFixed(1)"></strong></div>
                  </div>
                  <div class="overall-score">
                    <span>综合评分</span>
                    <strong x-text="previewReview.overall_score.toFixed(1) + ' / 100'"></strong>
                  </div>
                  <div class="critique">
                    <h4>评审意见</h4>
                    <p x-text="previewReview.critique"></p>
                  </div>
                  <template x-if="previewReview.suggestions && previewReview.suggestions.length > 0">
                    <div class="suggestions">
                      <h4>修改建议</h4>
                      <ul>
                        <template x-for="(s, i) in previewReview.suggestions" :key="i">
                          <li x-text="s"></li>
                        </template>
                      </ul>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="!previewReview">
                <p class="preview-empty">暂无评审记录。可前往「检查 → 智能评审」对本章进行评审。</p>
              </template>
            </div>

            <!-- 伏笔情况 -->
            <div x-show="previewSubTab === 'foreshadow'" class="preview-foreshadow-body">
              <template x-if="previewChapter && foreshadowings && foreshadowings.length > 0">
                <div class="foreshadow-preview-list">
                  <template x-for="f in foreshadowings.filter(fs => fs.chapter_id === previewChapter.id || fs.plant_chapter === previewChapter.order + 1)" :key="f.id">
                    <div class="foreshadow-preview-card" :class="`status-${f.status}`">
                      <div class="fpc-header">
                        <span class="fpc-title" x-text="f.title"></span>
                        <span class="fpc-status" :class="`badge-${f.status}`" x-text="f.status === 'active' ? '进行中' : f.status === 'resolved' ? '已回收' : '已废弃'"></span>
                      </div>
                      <div class="fpc-content" x-text="f.content || '暂无内容'"></div>
                      <div class="fpc-meta" x-show="f.plant_chapter || f.resolve_chapter">
                        <span x-show="f.plant_chapter">埋设: 第 <strong x-text="f.plant_chapter"></strong> 章</span>
                        <span x-show="f.resolve_chapter">回收: 第 <strong x-text="f.resolve_chapter"></strong> 章</span>
                      </div>
                    </div>
                  </template>
                  <template x-if="foreshadowings.filter(fs => fs.chapter_id === previewChapter.id || fs.plant_chapter === previewChapter.order + 1).length === 0">
                    <p class="preview-empty">本章暂无相关伏笔。</p>
                  </template>
                </div>
              </template>
              <template x-if="!foreshadowings || foreshadowings.length === 0">
                <p class="preview-empty">暂无伏笔数据。可前往「主题/伏笔」面板添加伏笔。</p>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>
    <!-- ═══ 必填缺失时弹出的"问卷补全" ═══ -->
    <template x-if="showMissingFieldsModal">
      <div class="modal-overlay modal-locked">
        <div class="modal">
          <button class="modal-close-x" @click="confirmCloseMissingFields()" data-tip="关闭">×</button>
          <h2>📝 补全必填信息</h2>
          <p class="modal-hint">以下信息必填，请补全后继续创建</p>
          <form @submit.prevent="fillMissingFromModal()">
            <template x-for="q in missingQuestionnaire" :key="q.id">
              <label class="missing-field">
                <span class="req">*</span>
                <span x-text="q.question"></span>
                <template x-if="q.type === 'text'">
                  <input type="text" :id="'miss-' + q.id" required>
                </template>
                <template x-if="q.type === 'textarea'">
                  <textarea :id="'miss-' + q.id" rows="3" required></textarea>
                </template>
                <template x-if="q.type === 'select'">
                  <select :id="'miss-' + q.id" required>
                    <option value="">-- 请选择 --</option>
                    <template x-for="opt in q.options" :key="opt">
                      <option :value="opt" x-text="opt"></option>
                    </template>
                  </select>
                </template>
              </label>
            </template>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" @click="confirmCloseMissingFields()">取消</button>
              <button type="submit" class="btn-primary">✓ 补全完成，继续创建</button>
            </div>
          </form>
        </div>
      </div>
    </template>

    <!-- ═══ 引导补全 Wizard（覆盖整个工作区） ═══ -->
    <template x-if="bootstrapWizard.visible">
      <div class="wizard-overlay">
        <div class="wizard-container">
          <header class="wizard-header">
            <h2>🤖 AI 正在为你的项目补全设定...</h2>
            <button class="btn-small" @click="closeBootstrapWizard()">×</button>
          </header>

          <div class="wizard-progress">
            <div class="progress-bar">
              <div class="progress-fill" :style="`width: ${bootstrapProgressPct()}%`"></div>
            </div>
            <div class="progress-text">
              <span x-text="`${bootstrapProgressPct()}% · ${bootstrapDurationText()}`"></span>
              <span class="status-pill" :class="`status-${bootstrapWizard.status}`"
                    x-text="{
                      running: '执行中',
                      completed: '已完成，待提交',
                      committed: '已写入数据库',
                      failed: '部分失败'
                    }[bootstrapWizard.status] || bootstrapWizard.status"></span>
            </div>
          </div>

          <div class="wizard-stages">
            <template x-for="stage in bootstrapWizard.stages" :key="stage.id">
              <div class="wizard-stage" :class="`stage-${stage.status}`">
                <div class="stage-head">
                  <span class="stage-icon">
                    <!-- running 状态显示 loading.gif，其他状态显示 emoji -->
                    <template x-if="stage.status === 'running'">
                      <img class="stage-icon-gif"
                           src="/static/images/laoding.gif"
                           alt="加载中" />
                    </template>
                    <template x-if="stage.status !== 'running'">
                      <span x-text="bootstrapStageIcon(stage.status)"></span>
                    </template>
                  </span>
                  <div class="stage-info">
                    <div class="stage-name">
                      <span x-text="stage.name"></span>
                      <!-- 每个 stage 的耗时（running 实时 / 已完成最终值）-->
                      <span class="stage-elapsed" x-show="stage.elapsed_s !== undefined"
                            x-text="formatStageElapsed(stage)"></span>
                    </div>
                    <div class="stage-desc" x-text="stage.description"></div>
                    <div class="stage-meta">
                      <span class="meta-tag" x-show="stage.needs_llm">需要 LLM</span>
                      <span class="meta-tag" x-show="!stage.needs_llm">用户已填</span>
                      <template x-for="dep in stage.depends_on" :key="dep">
                        <span class="meta-dep" x-text="`依赖: ${dep}`"></span>
                      </template>
                      <span class="meta-tag meta-error" x-show="stage.error" x-text="`❌ ${stage.error}`"></span>
                    </div>
                  </div>
                  <!-- 重新生成按钮已移至「大纲」面板的 AI 生成设定区域，不再在向导里显示 -->
                </div>
              </div>
            </template>
          </div>

          <footer class="wizard-footer">
            <!--
              简化设计：
              - 自动提交入库：完成后无需用户点提交按钮（_pollBootstrapStatus 会自动触发）
              - 重新生成按钮已移至「设定文档预览」界面（大纲与世界面板），不在向导里
              - 仅保留「进入写作台」作为终态出口
            -->
            <template x-if="bootstrapWizard.status === 'committed'">
              <div class="footer-actions">
                <button class="btn-primary" @click="closeBootstrapWizard()">进入写作台 →</button>
              </div>
            </template>
            <template x-if="bootstrapWizard.status === 'committing'">
              <div class="footer-actions">
                <span style="color: var(--text-muted);">⏳ 正在自动写入数据库，请稍候...</span>
              </div>
            </template>
            <template x-if="bootstrapWizard.status === 'failed' || bootstrapWizard.status === 'partial'">
              <div class="error-msg">
                <span>⚠️ 部分 stage 失败 / 未完成。请到「大纲」面板的 AI 生成设定区域重新生成失败的部分。</span>
              </div>
            </template>
            <template x-if="bootstrapWizard.status === 'running'">
              <span class="running-hint">⏳ 正在调用 LLM 完成补全，请稍候...</span>
            </template>
          </footer>
        </div>
      </div>
    </template>

  </div>

  <script src="/static/js/app.js?v=9"></script>
</body>
</html>



    <!-- ═══ 灵感主界面（1 级功能：全屏 modal） ═══ -->
    <template x-if="showInspirationHub">
      <div class="modal-overlay">
        <div class="modal modal-fullscreen">
          <header class="inspiration-hub-header">
            <h2>💡 灵感池 <span class="hint">搜索 / 标签 / 融合到项目 / 创建新小说</span></h2>
            <button class="modal-close-x" @click="showInspirationHub = false" data-tip="关闭">×</button>
          </header>

          <div class="inspiration-toolbar">
            <input type="text" class="search-input" x-model="inspSearch.q"
                   @input.debounce.300ms="loadInspirationHub()"
                   placeholder="🔍 搜索灵感（标题/内容）...">

            <select x-model="inspSearch.projectScope" @change="loadInspirationHub()">
              <option value="global">🌍 全局灵感池</option>
              <option value="current">📂 当前项目</option>
              <option value="all">📚 全局 + 当前项目</option>
            </select>

            <select x-model="inspSearch.source" @change="loadInspirationHub()">
              <option value="">来源（全部）</option>
              <template x-for="s in inspSources" :key="s">
                <option :value="s" x-text="s"></option>
              </template>
            </select>

            <label class="checkbox-inline">
              <input type="checkbox" x-model="inspSearch.includeConsumed" @change="loadInspirationHub()">
              含已融合
            </label>

            <button class="btn-primary" @click="openInspirationEditor()">+ 新建灵感</button>
          </div>

          <div class="tag-cloud" x-show="inspTagCloud.length > 0">
            <span class="tag-label">标签：</span>
            <button class="tag-chip" :class="{ active: !inspSearch.tag }"
                    @click="inspSearch.tag = ''; loadInspirationHub()">全部</button>
            <template x-for="t in inspTagCloud" :key="t.name">
              <button class="tag-chip" :class="{ active: inspSearch.tag === t.name }"
                      @click="inspSearch.tag = inspSearch.tag === t.name ? '' : t.name; loadInspirationHub()">
                <span x-text="t.name"></span>
                <span class="tag-count" x-text="t.count"></span>
              </button>
            </template>
          </div>

          <div class="inspiration-grid">
            <template x-if="inspLoading">
              <p class="empty-hint">加载中...</p>
            </template>
            <template x-if="!inspLoading && inspirations.length === 0">
              <p class="empty-hint">暂无灵感。点击"+ 新建灵感"开始记录。</p>
            </template>
            <template x-for="insp in inspirations" :key="insp.id">
              <div class="inspiration-card" :class="{ consumed: insp.is_consumed }">
                <div class="insp-card-head">
                  <h3 x-text="insp.title || '(无标题)'"></h3>
                  <span class="insp-source" x-show="insp.source" x-text="insp.source"></span>
                  <span class="insp-consumed-badge" x-show="insp.is_consumed">✓ 已融合</span>
                </div>
                <p class="insp-content" x-text="insp.content"></p>
                <div class="insp-tags" x-show="insp.tags && insp.tags.length">
                  <template x-for="t in insp.tags" :key="t">
                    <span class="insp-tag" x-text="'#' + t"></span>
                  </template>
                </div>
                <div class="insp-meta">
                  <span x-text="new Date(insp.created_at).toLocaleDateString()"></span>
                  <span x-show="insp.consumed_into" x-text="'→ ' + insp.consumed_into"></span>
                </div>
                <div class="insp-actions">
                  <button class="btn-small" @click="openInspirationEditor(insp)">✏️ 编辑</button>
                  <button class="btn-small btn-primary" @click="openCreateProjectFromInspiration(insp)">📖 创建小说</button>
                  <button class="btn-small" @click="openFuseInspiration(insp)">🔀 融合</button>
                  <button class="btn-small btn-danger" @click="deleteInspirationById(insp.id)">🗑</button>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </template>


    <!-- ═══ 灵感编辑（新建/编辑） ═══ -->
    <template x-if="showInspirationEditor">
      <div class="modal-overlay">
        <div class="modal modal-wide">
          <button class="modal-close-x" @click="showInspirationEditor = false" data-tip="关闭">×</button>
          <h2 x-text="editingInspiration.id ? '✏️ 编辑灵感' : '💡 新建灵感'"></h2>
          <form @submit.prevent="saveInspirationFromEditor()">
            <label>
              标题（一句话）
              <input type="text" x-model="editingInspiration.title" placeholder="例：主角在镜中看到自己老了 30 岁">
            </label>
            <label>
              内容 *
              <textarea x-model="editingInspiration.content" rows="6" required
                        placeholder="详细描述灵感..."></textarea>
            </label>
            <div class="form-row">
              <label>
                来源
                <input type="text" x-model="editingInspiration.source" list="insp-source-list"
                       placeholder="脑洞 / 阅读 / 梦境 / 生活">
                <datalist id="insp-source-list">
                  <template x-for="s in inspSources" :key="s">
                    <option :value="s"></option>
                  </template>
                </datalist>
              </label>
              <label>
                标签（逗号分隔）
                <input type="text" x-model="editingInspiration.tagInput"
                       placeholder="例: 伏笔, 人物弧光, 反转">
              </label>
            </div>
            <label>
              关联项目（可选）
              <select x-model="editingInspiration.project_id">
                <option :value="null">🌍 全局（不绑项目）</option>
                <template x-for="p in projects" :key="p.id">
                  <option :value="p.id" x-text="p.title"></option>
                </template>
              </select>
            </label>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" @click="showInspirationEditor = false">取消</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>
    </template>


    <!-- ═══ 灵感 → 创建项目（弹窗） ═══ -->
    <template x-if="showCreateFromInspiration">
      <div class="modal-overlay">
        <div class="modal">
          <button class="modal-close-x" @click="showCreateFromInspiration = false">×</button>
          <h2>📖 以灵感为种子创建项目</h2>
          <p class="modal-hint">基于灵感《<span x-text="inspForCreateProject?.title || '(无标题)'"></span>》</p>
          <form @submit.prevent="submitCreateProjectFromInspiration()">
            <label>
              书名
              <input type="text" x-model="createFromInspForm.title" required>
            </label>
            <div class="form-row">
              <label>
                章节字数（千字）
                <select x-model.number="createFromInspForm.chapter_word_count">
                  <template x-for="n in [2,3,4,5]" :key="n">
                    <option :value="n" x-text="n + ' 千字'"></option>
                  </template>
                </select>
              </label>
              <label>
                主题材
                <select x-model="createFromInspForm.genre">
                  <template x-for="g in genreList" :key="g.id">
                    <option :value="g.name" x-text="g.name"></option>
                  </template>
                </select>
              </label>
            </div>
            <label>
              一句话故事
              <textarea x-model="createFromInspForm.description" rows="3" required></textarea>
            </label>
            <p class="hint">💡 灵感的全文会自动作为 premise（世界观/背景）补充</p>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" @click="showCreateFromInspiration = false">取消</button>
              <button type="submit" class="btn-primary">🚀 创建 + 启动引导补全</button>
            </div>
          </form>
        </div>
      </div>
    </template>


    <!-- ═══ 灵感 → 融合到项目（弹窗） ═══ -->
    <template x-if="showFuseInspiration">
      <div class="modal-overlay">
        <div class="modal">
          <button class="modal-close-x" @click="showFuseInspiration = false">×</button>
          <h2>🔀 融合灵感到项目</h2>
          <p class="modal-hint">灵感：<span x-text="inspForFuse?.title || '(无标题)'"></span></p>
          <form @submit.prevent="submitFuseInspiration()">
            <label>
              目标项目
              <select x-model="fuseForm.project_id" required>
                <option value="">-- 请选择 --</option>
                <template x-for="p in projects" :key="p.id">
                  <option :value="p.id" x-text="p.title"></option>
                </template>
              </select>
            </label>
            <label x-show="fuseForm.project_id">
              融合位置
              <select x-model="fuseForm.target" required>
                <option value="outline">📋 项目大纲（追加为段落）</option>
                <option value="world">🌍 世界观（新增条目）</option>
                <option value="character">👤 角色（新增配角）</option>
                <option value="chapter">📖 章节细纲（追加到指定章节）</option>
                <option value="chapter_content">✍️ 章节正文（追加到指定章节）</option>
              </select>
            </label>
            <label x-show="fuseForm.target === 'chapter' || fuseForm.target === 'chapter_content'">
              指定章节（不填则追加到最后一章）
              <select x-model="fuseForm.chapterOrder">
                <option :value="null">最后一章</option>
                <template x-for="n in chapterSelectOptions" :key="n">
                  <option :value="n" x-text="'第 ' + (n+1) + ' 章'"></option>
                </template>
              </select>
            </label>
            <label>
              融合备注（可选）
              <textarea x-model="fuseForm.note" rows="2"
                        placeholder="比如：这个灵感应该作为第 5 章的反转伏笔..."></textarea>
            </label>
            <div class="modal-actions">
              <button type="button" class="btn-secondary" @click="showFuseInspiration = false">取消</button>
              <button type="submit" class="btn-primary">🔀 融合</button>
            </div>
          </form>
        </div>
      </div>
    </template>
    </div>

</body>
</html>
