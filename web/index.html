<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CozyWriter - 小说编写助手</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css?v=8">

<style>
/* === 流水线进度面板 === */
.pipeline-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.pipeline-overall { margin: 8px 0 16px; }
.pipeline-overall-text { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; }
.pipeline-stages { display: flex; flex-direction: column; gap: 6px; }
.pipeline-stage { display: flex; align-items: flex-start; gap: 12px; padding: 8px 10px; border-radius: 6px; background: #f8fafc; border-left: 3px solid #cbd5e1; transition: all .2s; }
.pipeline-stage.stage-running { background: #eff6ff; border-left-color: #3b82f6; }
.pipeline-stage.stage-completed { background: #f0fdf4; border-left-color: #10b981; }
.pipeline-stage.stage-failed { background: #fef2f2; border-left-color: #ef4444; }
.pipeline-stage.stage-skipped { background: #f1f5f9; border-left-color: #94a3b8; opacity: 0.6; }
.stage-marker { display: flex; flex-direction: column; align-items: center; min-width: 30px; }
.stage-num { font-size: 11px; color: #64748b; font-weight: 600; }
.stage-icon { font-size: 16px; }
.stage-body { flex: 1; }
.stage-label { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 500; }
.stage-elapsed { font-size: 11px; color: #64748b; font-weight: normal; }
.stage-bar { margin-top: 4px; height: 4px; background: #e2e8f0; border-radius: 2px; overflow: hidden; }
.stage-bar-fill { height: 100%; background: #3b82f6; transition: width .3s; }
.pipeline-stage.stage-completed .stage-bar-fill { background: #10b981; }
.stage-error { font-size: 11px; color: #ef4444; margin-top: 4px; }
.pipeline-result { padding: 8px 10px; background: #f0fdf4; border-radius: 4px; font-size: 13px; }
.pipeline-failed { background: #fef2f2; }
.pipeline-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* === 任务管理：子任务详情 === */
.btn-tiny { background: transparent; border: 1px solid #cbd5e1; color: #475569; padding: 1px 8px; border-radius: 10px; font-size: 11px; cursor: pointer; }
.btn-tiny:hover { background: #f1f5f9; }
.task-pipeline-detail { margin-top: 8px; padding: 8px 10px; background: #f8fafc; border-radius: 4px; }
.tpd-overall { font-size: 12px; color: #475569; margin-bottom: 6px; }
.tpd-stages { display: flex; flex-direction: column; gap: 3px; }
.tpd-stage { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; }
.tpd-stage.stage-completed { color: #047857; }
.tpd-stage.stage-running { color: #1d4ed8; font-weight: 500; }
.tpd-stage.stage-failed { color: #b91c1c; }
.tpd-icon { width: 16px; }
.tpd-time { color: #94a3b8; font-size: 11px; margin-left: auto; }
.tpd-err { color: #ef4444; font-size: 11px; margin-left: 6px; }
</style>

</head>
<body>
  <div id="app" x-data="cozywriterApp" x-init="init()">

    <!-- ═══ Setup Wizard ═══ -->
    <template x-if="showSetupWizard">
      <div class="wizard-overlay">
        <div class="wizard-container">
          <h1>欢迎使用 CozyWriter</h1>
          <p class="subtitle">智能小说编写助手 — LLM + RAG 知识管理 + 智能评审</p>
          <template x-if="setupStep === 2">
            <div class="wizard-step">
              <h2>第 1 步：选择大模型服务商</h2>
              <div class="provider-list">
                <label class="provider-option">
                  <input type="radio" name="provider" value="anthropic" x-model="selectedProvider">
                  <span class="provider-name">Anthropic (Claude)</span>
                  <span class="provider-desc">能力强，支持长上下文</span>
                </label>
                <label class="provider-option">
                  <input type="radio" name="provider" value="openai" x-model="selectedProvider">
                  <span class="provider-name">OpenAI (GPT)</span>
                  <span class="provider-desc">GPT-4o 系列</span>
                </label>
                <label class="provider-option">
                  <input type="radio" name="provider" value="MiniMax" x-model="selectedProvider">
                  <span class="provider-name">MiniMax (MiniMax)</span>
                  <span class="provider-desc">M2.7 文本 / M3 多模态 1M · Anthropic 兼容 API</span>
                </label>
                <label class="provider-option">
                  <input type="radio" name="provider" value="ollama" x-model="selectedProvider">
                  <span class="provider-name">Ollama (本地模型)</span>
                  <span class="provider-desc">本地运行开源模型，完全离线</span>
                </label>
              </div>
              <button class="btn-primary" @click="nextSetupStep()" :disabled="!selectedProvider">下一步</button>
            </div>
          </template>
          <template x-if="setupStep === 3">
            <div class="wizard-step">
              <h2>第 2 步：配置 API Key</h2>
              <template x-if="selectedProvider === 'ollama'">
                <div>
                  <label>Ollama 服务地址</label>
                  <input type="text" x-model="providerConfig.baseUrl" placeholder="http://localhost:11434">
                  <p class="hint">默认: http://localhost:11434</p>
                </div>
              </template>
              <template x-if="selectedProvider !== 'ollama'">
                <div>
                  <label x-text="selectedProvider === 'anthropic' ? 'Anthropic API Key' : 'OpenAI API Key'"></label>
                  <input type="password" x-model="providerConfig.apiKey" placeholder="sk-ant-..." style="width:100%">
                  <p class="hint">从官网获取</p>
                </div>
              </template>
              <div class="wizard-nav">
                <button class="btn-secondary" @click="setupStep = 2">上一步</button>
                <button class="btn-primary" @click="saveProvider()">保存并继续</button>
              </div>
            </div>
          </template>
          <template x-if="setupStep === 4">
            <div class="wizard-step">
              <h2>第 3 步：下载 Embedding 模型</h2>
              <div class="model-info">
                <p><strong>模型:</strong> <span x-text="modelStatus.model_name"></span></p>
                <p><strong>用途:</strong> 中文语义 embedding，用于 RAG 知识检索</p>
                <p><strong>大小:</strong> ~400MB | <strong>加速:</strong> HuggingFace 镜像</p>
              </div>
              <template x-if="!modelStatus.downloaded">
                <template x-if="!downloading">
                  <button class="btn-primary" @click="downloadModel()">下载模型</button>
                </template>
                <template x-if="downloading">
                  <div class="download-progress">
                    <div class="progress-stage" x-text="{
                      started: '准备下载...',
                      migrating: '迁移旧缓存...',
                      downloading: '下载模型文件中...',
                      finished: '完成',
                      error: '出错'
                    }[downloadProgress.stage] || downloadProgress.message"></div>
                    <div class="progress-bar-wrap">
                      <div class="progress-bar-track">
                        <div class="progress-bar-fill" :style="`width: ${downloadProgress.percent}%`"></div>
                      </div>
                      <div class="progress-percent" x-text="`${downloadProgress.percent}%`"></div>
                    </div>
                    <div class="progress-detail">
                      <span x-text="`${formatBytes(downloadProgress.current)} / ${formatBytes(downloadProgress.total)}`"></span>
                      <span x-show="downloadProgress.speed_mbps > 0" x-text="`${downloadProgress.speed_mbps.toFixed(1)} MB/s`"></span>
                      <span x-text="`耗时 ${downloadProgress.elapsed_s}s`"></span>
                    </div>
                  </div>
                </template>
              </template>
              <template x-if="modelStatus.downloaded">
                <p class="success">✅ 模型已就绪</p>
              </template>
              <div class="wizard-nav">
                <button class="btn-secondary" @click="setupStep = 3">上一步</button>
                <button class="btn-primary" @click="finishSetup()" :disabled="!modelStatus.downloaded">完成初始化</button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- ═══ 主界面 ═══ -->
    <template x-if="!showSetupWizard">
      <div class="main-layout">

        <!-- 顶部导航 -->
        <header class="topbar">
          <div class="topbar-left">
            <template x-if="!currentProject">
              <span class="logo">🏠 CozyWriter</span>
            </template>
            <template x-if="currentProject">
              <button class="btn-icon back-btn" @click="backToHome()" title="返回项目列表">
                ← 返回
              </button>
            </template>
          </div>
          <div class="topbar-center">
            <template x-if="currentProject">
              <span class="project-title" x-text="currentProject.title"></span>
            </template>
          </div>
          <div class="topbar-right">
            <button class="btn-icon" @click="openInspirationHub()" title="灵感池">
              💡
              <template x-if="inspirationCount > 0">
                <span class="badge" x-text="inspirationCount"></span>
              </template>
            </button>
            <button class="btn-icon" @click="openTaskManager()" title="任务管理">
              📋
              <template x-if="activeTaskCount > 0">
                <span class="badge" x-text="activeTaskCount"></span>
              </template>
            </button>
            <button class="btn-icon" @click="showProjectSettings = true" title="项目设置">⚙️</button>
            <button class="btn-icon" @click="openGlobalSettings()" title="全局设置">🔧</button>
          </div>
        </header>

        <div class="content-area">

          <!-- 左侧边栏 -->
          <aside class="sidebar" x-show="currentProject">
            <div class="sidebar-section">
              <div class="sidebar-header">
                <span>章节</span>
                <button class="btn-icon" @click="createChapter()" title="新建章节">➕</button>
              </div>
              <ul class="chapter-list">
                <template x-for="chapter in chapters" :key="chapter.id">
                  <li :class="{ active: currentChapter && currentChapter.id === chapter.id }" @click="selectChapter(chapter)">
                    <span x-text="`${chapter.order + 1}. ${chapter.title}`"></span>
                    <span class="word-count" :style="getWordCountStyle(chapter)" x-text="`${chapter.word_count}字`"></span>
                  </li>
                </template>
              </ul>
            </div>

            <div class="sidebar-section">
              <div class="sidebar-header"><span>工具</span></div>
              <div class="tool-buttons">
                <button @click="activePanel = 'writing'; _saveLastView()" :class="{ active: activePanel === 'writing' }">✍️ 写作</button>
                <!--
                  子面板同步：点击面板时同时设置默认子页签，
                  避免进入角色/主题/检查面板后默认显示空白。
                -->
                <button @click="activePanel = 'outline-plan'; outlineSubPanel = 'overview'; _saveLastView()" :class="{ active: activePanel === 'outline-plan' }">📋 大纲</button>
                <button @click="activePanel = 'character-matrix'; subPanel = 'characters'; _saveLastView()" :class="{ active: activePanel === 'character-matrix' }">👥 角色</button>
                <button @click="activePanel = 'worldbuilding'; _saveLastView()" :class="{ active: activePanel === 'worldbuilding' }">🌍 世界观</button>
                <button @click="activePanel = 'theme'; subPanel = 'themes'; _saveLastView()" :class="{ active: activePanel === 'theme' }">🎯 主题/伏笔</button>
                <button @click="activePanel = 'check'; subPanel = 'consistency'; _saveLastView()" :class="{ active: activePanel === 'check' }">🔍 检查</button>
                <button @click="activePanel = 'inspirations'; _saveLastView()" :class="{ active: activePanel === 'inspirations' }">💡 灵感</button>
                <button @click="openExportModal()">📤 导出</button>
              </div>
            </div>

            <!-- 字数目标进度 -->
            <template x-if="currentProject">
              <div class="sidebar-section">
                <div class="sidebar-header"><span>字数进度</span></div>
                <div class="word-progress">
                  <div class="wp-bar">
                    <div class="wp-fill" :style="`width: ${wordProgressPercent}%`"></div>
                  </div>
                  <div class="wp-text">
                    <span x-text="`${currentProject.word_count || 0} / ${currentProject.target_word_count || 0} 字`"></span>
                    <span x-text="`${chapters.length} 章`"></span>
                  </div>
                  <div class="wp-range" x-text="`目标: ${currentProject.word_count_min || 0}～${currentProject.word_count_max || 0}字/章`"></div>
                </div>
              </div>
            </template>
          </aside>

          <!-- 中间：写作台 / 各面板 -->
          <main class="editor-area">

            <!-- 无项目时 -->
            <template x-if="!currentProject">
              <div class="welcome-screen">
                <h2>欢迎使用 CozyWriter</h2>
                <div class="welcome-actions">
                  <button class="btn-primary" @click="openCreateProjectModal()">创建小说</button>
                  <button class="btn-secondary" @click="startQuestionnaire()">🎯 从创意问卷开始</button>
                  <template x-if="savedQuestionnaires.length > 0">
                    <button class="btn-secondary" @click="activePanel = 'questionnaire'">📋 继续问卷</button>
                  </template>
                </div>
                <template x-if="projects.length > 0">
                  <div class="project-list">
                    <h3>已有项目</h3>
                    <template x-for="p in projects" :key="p.id">
                      <div class="project-card" @click="openProject(p)">
                        <div class="project-card-header">
                          <h4 x-text="p.title"></h4>
                          <span class="project-genre-tag" x-show="p.genre" x-text="p.genre"></span>
                        </div>
                        <p class="project-card-desc" x-text="p.description || '暂无描述'"></p>
                        <div class="project-meta">
                          <span x-show="p.genre" style="display: none;">📚 <span x-text="p.genre" style="display: none;"></span></span>
                          <span>📖 <span x-text="`${p.chapter_count || 0} / ${p.total_chapters || '?'} 章`"></span></span>
                          <span>📝 <span x-text="`每章 ${(p.target_word_count || 0)} 字`"></span></span>
                          <span>📅 <span x-text="(p.created_at || '').slice(0,10)"></span></span>
                      </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <!-- 写作台之前的 AI 补全 banner -->
            <template x-if="currentProject && bootstrapBanner.visible">
              <div class="ai-bootstrap-banner" :class="`banner-${bootstrapBanner.kind}`">
                <span class="banner-icon" x-text="{
                  in_flight: '⏳',
                  awaiting_commit: '✅',
                  partial_failed: '⚠️',
                  aborted: '🔌',
                  cancelled: '⛔'
                }[bootstrapBanner.kind] || '🤖'"></span>
                <div class="banner-text">
                  <strong x-text="{
                    in_flight: 'AI 补全进行中：',
                    awaiting_commit: 'AI 补全完成：',
                    partial_failed: 'AI 补全部分失败：',
                    aborted: '服务重启导致中断：',
                    cancelled: 'AI 补全被取消：'
                  }[bootstrapBanner.kind] || 'AI 补全：'"></strong>
                  <span x-text="bootstrapBanner.message"></span>
                </div>
                <button class="btn-small" @click="openBootstrapWizard(bootstrapBanner.projectId, bootstrapBanner.runId)"
                        x-text="{
                          in_flight: '查看进度',
                          awaiting_commit: '提交入库',
                          partial_failed: '查看/重跑',
                          aborted: '重新启动',
                          cancelled: '查看详情'
                        }[bootstrapBanner.kind] || '查看'"></button>
                <button class="btn-small btn-dismiss" @click="dismissBootstrapBanner()">×</button>
              </div>
            </template>

            <!-- 写作台 -->
            <template x-if="currentProject && currentChapter">
              <div class="writing-desk">
                <!-- 章节信息栏 + 页签 -->
                <div class="chapter-header-bar">
                  <div class="chapter-info-left">
                    <span class="chapter-num" x-text="`第${currentChapter.order + 1}章`"></span>
                    <input type="text" class="chapter-title-input" x-model="currentChapter.title" @change="saveChapter()">
                    <span class="chapter-meta" x-text="`字数: ${currentChapter.word_count}`"></span>
                    <span class="chapter-score" x-show="previewReview">评分: <strong x-text="previewReview?.overall_score?.toFixed(1) || '-'"></strong> / 100</span>
                  </div>
                  <div class="writing-tabs">
                    <!-- 当前 LLM 模型指示（点击可在后续跳到全局设置）-->
                    <span class="toolbar-llm" x-show="currentLlmLabel"
                          title="当前使用的 LLM（来自项目默认 provider）" style="margin-right: 10px;">
                      <span class="toolbar-llm-icon">当前模型：🤖</span>
                      <span class="toolbar-llm-name" x-text="currentLlmLabel"></span>
                    </span>
                    <button :class="{ active: writingTab === 'content' }" @click="writingTab = 'content'; _saveLastView()">正文</button>
                    <button :class="{ active: writingTab === 'outline' }" @click="writingTab = 'outline'; _saveLastView()">细纲</button>
                    <button :class="{ active: writingTab === 'review' }" @click="writingTab = 'review'; _saveLastView()">评审报告</button>
                  </div>
                </div>

                <!-- 正文编辑区 -->
                <div x-show="writingTab === 'content'" class="writing-tab-content">
                  <!-- 已发生事件清单 + RAG 相似事件（防重复写作辅助） -->
                  <details class="prep-info-card" x-show="currentChapter && currentChapter.id" style="margin-bottom: 10px;">
                    <summary style="cursor: pointer; padding: 8px 12px; background: #f5f5f5; border-radius: 6px; user-select: none;">
                      📚 已发生事件 + RAG 相似过去章节
                      <span x-show="chapterPrepInfo?.max_dedup_similarity > 0" style="color: #d9534f; margin-left: 8px;">
                        (最高相似度 <span x-text="(chapterPrepInfo?.max_dedup_similarity || 0).toFixed(2)"></span>)
                      </span>
                    </summary>
                    <div style="padding: 10px 14px; border: 1px solid #e0e0e0; border-top: none; border-radius: 0 0 6px 6px;">
                      <h4 style="margin: 8px 0 6px 0; color: #d9534f;">⚠️ 已发生事件 (硬约束：不得重复)</h4>
                      <div x-show="!chapterPrepInfo || (chapterPrepInfo.previous_events || []).length === 0"
                           style="color: #888; font-size: 0.9em;">暂无（这是首章）</div>
                      <ul style="margin: 4px 0 12px 16px; font-size: 0.92em;">
                        <template x-for="ev in (chapterPrepInfo?.previous_events || [])" :key="'pe-' + ev.chapter">
                          <li>
                            <strong>第<span x-text="ev.chapter"></span>章《<span x-text="ev.title"></span>》</strong>:
                            <span x-text="ev.signature"></span>
                          </li>
                        </template>
                      </ul>

                      <h4 style="margin: 8px 0 6px 0; color: #f0ad4e;">🔍 RAG 相似过去事件（高相似度需规避）</h4>
                      <div x-show="!chapterPrepInfo || (chapterPrepInfo.dedup_matches || []).length === 0"
                           style="color: #888; font-size: 0.9em;">RAG 未命中相似事件</div>
                      <ul style="margin: 4px 0 4px 16px; font-size: 0.92em;">
                        <template x-for="m in (chapterPrepInfo?.dedup_matches || [])" :key="'dm-' + m.chapter">
                          <li :style="{ color: m.similarity >= 0.65 ? '#d9534f' : '#666' }">
                            第<span x-text="m.chapter"></span>章《<span x-text="m.title"></span>》
                            <span style="font-weight: bold;">(相似度 <span x-text="m.similarity?.toFixed(2)"></span>)</span>:
                            <span x-text="m.signature"></span>
                          </li>
                        </template>
                      </ul>
                    </div>
                  </details>

                  <textarea class="content-editor" x-model="currentChapter.content" @input="onContentChange()" placeholder="开始写作..."></textarea>
                </div>

                <!-- 细纲显示区 -->
                <div x-show="writingTab === 'outline'" class="writing-tab-content writing-outline-panel">
                  <template x-if="chapterOutlinesMap[currentChapter.id]">
                    <div class="outline-detail">
                      <div class="outline-meta-grid">
                        <div class="omg-item"><span>位置</span><strong x-text="chapterOutlinesMap[currentChapter.id].chapter_position || '-'"></strong></div>
                        <div class="omg-item"><span>节拍</span><strong x-text="chapterOutlinesMap[currentChapter.id].pacing || '-'"></strong></div>
                        <div class="omg-item"><span>字数目标</span><strong x-text="(chapterOutlinesMap[currentChapter.id].target_word_count || 0) + ' 字'"></strong></div>
                        <div class="omg-item"><span>状态</span><strong x-text="chapterOutlinesMap[currentChapter.id].status || '-'"></strong></div>
                      </div>
                      <div class="outline-section">
                        <h4>核心内容</h4>
                        <div class="outline-text" x-text="chapterOutlinesMap[currentChapter.id].key_content || '暂无'"></div>
                      </div>
                      <div class="outline-section">
                        <h4>剧情推进</h4>
                        <div class="outline-text" x-text="chapterOutlinesMap[currentChapter.id].plot_advance || '暂无'"></div>
                      </div>
                      <template x-if="(chapterOutlinesMap[currentChapter.id].conflicts || []).length > 0">
                        <div class="outline-section">
                          <h4>冲突/矛盾</h4>
                          <ul>
                            <template x-for="(c, i) in chapterOutlinesMap[currentChapter.id].conflicts" :key="i">
                              <li x-text="c"></li>
                            </template>
                          </ul>
                        </div>
                      </template>
                      <template x-if="(chapterOutlinesMap[currentChapter.id].highlights || []).length > 0">
                        <div class="outline-section">
                          <h4>高光时刻</h4>
                          <ul>
                            <template x-for="(h, i) in chapterOutlinesMap[currentChapter.id].highlights" :key="i">
                              <li x-text="h"></li>
                            </template>
                          </ul>
                        </div>
                      </template>
                      <template x-if="chapterOutlinesMap[currentChapter.id].foreshadow_notes">
                        <div class="outline-section">
                          <h4>伏笔操作</h4>
                          <div class="outline-text" x-text="chapterOutlinesMap[currentChapter.id].foreshadow_notes"></div>
                        </div>
                      </template>

                      <!-- ═══ 起承转合四阶段结构 ═══ -->
                      <template x-if="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he && Object.keys(chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he || {}).length > 0">
                        <div class="outline-section">
                          <h4>起承转合结构</h4>
                          <div class="qczh-grid">
                            <template x-for="phase in ['qi','cheng','zhuan','he']" :key="phase">
                              <template x-if="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase]">
                                <div class="qczh-card" :class="`qczh-${phase}`">
                                  <div class="qczh-head">
                                    <span class="qczh-label" x-text="{qi:'起 · 开篇',cheng:'承 · 推进',zhuan:'转 · 高潮',he:'合 · 收束'}[phase]"></span>
                                    <span class="qczh-wc" x-show="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].word_count"
                                          x-text="`${chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].word_count}字`"></span>
                                  </div>
                                  <div class="qczh-summary" x-text="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].summary || ''"></div>
                                  <template x-if="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].hook">
                                    <div class="qczh-extra">🪝 <span x-text="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].hook"></span></div>
                                  </template>
                                  <template x-if="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].turning_point">
                                    <div class="qczh-extra">⚡ <span x-text="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].turning_point"></span></div>
                                  </template>
                                  <template x-if="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].climax">
                                    <div class="qczh-extra">🔥 <span x-text="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].climax"></span></div>
                                  </template>
                                  <template x-if="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].hook_for_next">
                                    <div class="qczh-extra">➡️ <span x-text="chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].hook_for_next"></span></div>
                                  </template>
                                  <template x-if="(chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].beats || []).length > 0">
                                    <ul class="qczh-beats">
                                      <template x-for="(b, i) in chapterOutlinesMap[currentChapter.id].qi_cheng_zhuan_he[phase].beats" :key="i">
                                        <li x-text="b"></li>
                                      </template>
                                    </ul>
                                  </template>
                                </div>
                              </template>
                            </template>
                          </div>
                        </div>
                      </template>

                      <!-- ═══ 章内钩子（每 500 字一个）═══ -->
                      <template x-if="(chapterOutlinesMap[currentChapter.id].pacing_hooks || []).length > 0">
                        <div class="outline-section">
                          <h4>章内钩子</h4>
                          <ul>
                            <template x-for="(h, i) in chapterOutlinesMap[currentChapter.id].pacing_hooks" :key="'ph-' + i">
                              <li>
                                <span class="hook-pos" x-text="h.position || ''"></span>
                                <span class="hook-type" x-text="h.type || ''"></span>
                                <span class="hook-desc" x-text="h.description || ''"></span>
                              </li>
                            </template>
                          </ul>
                        </div>
                      </template>

                      <!-- ═══ 反转安排 ═══ -->
                      <template x-if="(chapterOutlinesMap[currentChapter.id].reversals || []).length > 0">
                        <div class="outline-section">
                          <h4>反转安排</h4>
                          <ul>
                            <template x-for="(r, i) in chapterOutlinesMap[currentChapter.id].reversals" :key="'rv-' + i">
                              <li>
                                <span class="rev-type" x-text="{small:'小反转',medium:'中反转',large:'大反转'}[r.type] || r.type || ''"></span>
                                <span class="rev-desc" x-text="r.description || ''"></span>
                                <template x-if="r.emotional_impact">
                                  <span class="rev-impact" x-text="`(情绪: ${r.emotional_impact})`"></span>
                                </template>
                              </li>
                            </template>
                          </ul>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="!chapterOutlinesMap[currentChapter.id]">
                    <div class="preview-empty">
                      <p>本章暂无细纲</p>
                      <p style="font-size:13px;color:var(--text-muted)">点击「一键生成」生成细纲和正文</p>
                    </div>
                  </template>
                </div>

                <!-- 评审报告显示区 -->
                <div x-show="writingTab === 'review'" class="writing-tab-content writing-review-panel">
                  <template x-if="previewReview">
                    <div class="review-detail">
                      <div class="review-scores">
                        <div class="score-item"><span>一致性</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_consistency * 10}%`"></div></div><strong x-text="previewReview.score_consistency?.toFixed(1)"></strong></div>
                        <div class="score-item"><span>节奏</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_pacing * 10}%`"></div></div><strong x-text="previewReview.score_pacing?.toFixed(1)"></strong></div>
                        <div class="score-item"><span>文笔风格</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_style * 10}%`"></div></div><strong x-text="previewReview.score_style?.toFixed(1)"></strong></div>
                        <div class="score-item"><span>去AI味</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_ai_removal * 10}%`"></div></div><strong x-text="previewReview.score_ai_removal?.toFixed(1)"></strong></div>
                        <div class="score-item"><span>字数合规</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_word_count * 10}%`"></div></div><strong x-text="previewReview.score_word_count?.toFixed(1)"></strong></div>
                        <div class="score-item"><span>伏笔管理</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_foreshadowing * 10}%`"></div></div><strong x-text="previewReview.score_foreshadowing?.toFixed(1)"></strong></div>
                        <div class="score-item"><span>角色弧光</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_character_arc * 10}%`"></div></div><strong x-text="previewReview.score_character_arc?.toFixed(1)"></strong></div>
                        <div class="score-item"><span>主旨契合</span><div class="score-bar"><div class="score-fill" :style="`width:${previewReview.score_thematic * 10}%`"></div></div><strong x-text="previewReview.score_thematic?.toFixed(1)"></strong></div>
                      </div>
                      <div class="overall-score">
                        <span>综合评分</span>
                        <strong x-text="previewReview.overall_score?.toFixed(1) + ' / 100'"></strong>
                      </div>
                      <div class="critique-section">
                        <h4>评审意见</h4>
                        <p x-text="previewReview.critique"></p>
                      </div>
                      <template x-if="previewReview.suggestions && previewReview.suggestions.length > 0">
                        <div class="suggestions-section">
                          <h4>修改建议</h4>
                          <ul>
                            <template x-for="(s, i) in previewReview.suggestions" :key="i">
                              <li x-text="s"></li>
                            </template>
                          </ul>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="!previewReview">
                    <div class="preview-empty">
                      <p>本章暂无评审记录</p>
                      <p style="font-size:13px;color:var(--text-muted)">点击「一键生成」后会自动评审</p>
                    </div>
                  </template>
                </div>

                <!-- 底部操作栏 -->
                <div class="editor-footer">
                  <div class="footer-left">
                    <span :class="getWordCountBadgeClass(currentChapter)" x-text="wordCountStatus(currentChapter)"></span>
                    <span class="ai-hint" x-show="currentChapter.word_count > (currentProject.word_count_max || 5000)">⚠️ 字数超出上限</span>
                  </div>
                  <div class="footer-actions">
                    <button class="btn-secondary" @click="saveChapter()" :disabled="!chapterDirty">💾 保存</button>
                    <button class="btn-primary" @click="pipelineSetupSetupModal()"
                            title="一键启动 9 步流水线（细纲→正文→评审→修订→保存→后处理）"
                            :disabled="!canRunPipeline">🤖 一键生成</button>
                    <button class="btn-secondary" @click="openBatchGenerateModal()"
                            title="批量生成多章（自动创建章节并逐章执行完整 9 步流水线）"
                            :disabled="batchGenerating">📦 批量生成</button>
                    <button class="btn-secondary" @click="openWordAdjustModal()"
                            :disabled="!currentChapter || !currentChapter.content"
                            title="只调整字数（缩写或扩写），不动剧情结构">📐 字数调整</button>
                    <button class="btn-secondary" @click="confirmRevise()"
                            :disabled="!currentChapter || !currentChapter.content"
                            title="根据细纲和评审报告重新生成正文，旧正文标记为废稿">📝 修订</button>
                  </div>
                </div>
              </div>
            </template>

            <!-- 章节列表（无章节时） -->
            <template x-if="currentProject && !currentChapter && chapters.length === 0">
              <div class="empty-chapter">
                <p>还没有章节</p>
                <button class="btn-primary" @click="createChapter()">创建第一章</button>
              </div>
            </template>


            <!-- ═══ 主题/伏笔面板 ═══ -->
            <template x-if="activePanel === 'theme' && currentProject">
              <div class="panel-page">
                <div class="panel-page-header">
                  <h2>🎯 主题与伏笔管理</h2>
                  <div class="panel-tabs">
                    <button :class="{ active: subPanel === 'themes' }" @click="subPanel = 'themes'">核心主旨</button>
                    <button :class="{ active: subPanel === 'foreshadowings' }" @click="subPanel = 'foreshadowings'">伏笔</button>
                  </div>
                </div>

                <!-- 核心主旨 -->
                <template x-if="subPanel === 'themes'">
                  <div class="panel-section">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                      <button class="btn-primary" @click="showThemeForm = true">➕ 添加主旨</button>
                      <button class="btn-secondary" @click="rerunBootstrapStageFromPanel('stage_2a_theme')"
                              :disabled="!currentProject || rerunStageBusy['stage_2a_theme']"
                              :title="rerunStageBtnTitle('stage_2a_theme')">
                        <span x-show="!rerunStageBusy['stage_2a_theme']">🔄 重新生成主旨</span>
                        <span x-show="rerunStageBusy['stage_2a_theme']">⏳ 生成中...</span>
                      </button>
                    </div>

                    <!--
                      🤖 AI 生成的主旨/基调（来自 bootstrapData.theme）
                      "主题"指 AI 在 stage_2a_theme 推导出来的：
                        - theme: 一句话核心主旨（如 "在泥沼中仰望星空"）
                        - tone:   小说基调（热血 / 治愈 / 黑暗 ...）
                      用户手动添加的 Theme 与 AI 生成的两个独立区块，避免混淆。
                    -->
                    <template x-if="bootstrapAiTheme()">
                      <div class="ai-preview-block" style="margin-bottom:12px">
                        <div class="ai-preview-header">
                          <span>🤖 AI 生成主旨</span>
                          <span class="ai-preview-hint">主题 + 基调</span>
                        </div>
                        <template x-if="bootstrapAiTheme().theme">
                          <div style="margin-top:6px">
                            <h4 style="margin:6px 0;font-size:13px;color:#6d28d9">💎 核心主题</h4>
                            <p x-text="bootstrapAiTheme().theme" style="font-size:15px;font-weight:600;line-height:1.5;color:#1e293b;padding:8px 10px;background:#fff;border-radius:4px"></p>
                          </div>
                        </template>
                        <template x-if="bootstrapAiTheme().tone">
                          <div style="margin-top:10px;display:flex;align-items:center;gap:8px">
                            <h4 style="margin:0;font-size:13px;color:#6d28d9">🎭 基调</h4>
                            <span style="font-size:13px;padding:2px 10px;background:#ede9fe;color:#6d28d9;border-radius:10px;font-weight:500" x-text="bootstrapAiTheme().tone"></span>
                          </div>
                        </template>
                      </div>
                    </template>

                    <div class="theme-list">
                      <template x-for="t in themes" :key="t.id">
                        <div class="theme-card">
                          <div class="theme-type" x-text="t.theme_type"></div>
                          <div class="theme-title" x-text="t.title"></div>
                          <div class="theme-desc" x-text="t.description || '暂无描述'"></div>
                        </div>
                      </template>
                    </div>
                    <!-- 新增主题表单 -->
                    <template x-if="showThemeForm">
                      <div class="inline-form">
                        <select x-model="themeForm.theme_type">
                          <option value="core_theme">核心主题</option>
                          <option value="author_intent">作者意图</option>
                          <option value="motif">意象/母题</option>
                          <option value="symbol">象征</option>
                        </select>
                        <input type="text" x-model="themeForm.title" placeholder="主旨标题，如：救赎">
                        <textarea x-model="themeForm.description" placeholder="详细描述..."></textarea>
                        <div class="form-actions">
                          <button class="btn-secondary" @click="showThemeForm = false">取消</button>
                          <button class="btn-primary" @click="saveTheme()">保存</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- 伏笔管理 -->
                <template x-if="subPanel === 'foreshadowings'">
                  <div class="panel-section">
                    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
                      <button class="btn-primary" @click="showForeshadowingForm = true">➕ 添加伏笔</button>
                      <button class="btn-secondary" @click="rerunBootstrapStageFromPanel('stage_4b_foreshadow')"
                              :disabled="!currentProject || rerunStageBusy['stage_4b_foreshadow']"
                              :title="rerunStageBtnTitle('stage_4b_foreshadow')">
                        <span x-show="!rerunStageBusy['stage_4b_foreshadow']">🔄 重新生成伏笔</span>
                        <span x-show="rerunStageBusy['stage_4b_foreshadow']">⏳ 生成中...</span>
                      </button>
                      <!-- 状态筛选 -->
                      <div style="display:flex;gap:4px;align-items:center;margin-left:auto">
                        <span style="font-size:12px;color:var(--text-muted)">筛选：</span>
                        <template x-for="opt in [
                          {key: 'all', label: '全部', count: foreshadowings.length},
                          {key: 'planted', label: '🌱 待开始', count: foreshadowings.filter(f => f.status === 'planted').length},
                          {key: 'active',  label: '🔥 进行中', count: foreshadowings.filter(f => f.status === 'active').length},
                          {key: 'resolved',label: '✅ 已回收', count: foreshadowings.filter(f => f.status === 'resolved').length},
                          {key: 'abandoned',label: '❌ 已废弃', count: foreshadowings.filter(f => f.status === 'abandoned').length}
                        ]" :key="opt.key">
                          <button type="button" class="btn-tiny"
                                  :class="foreshadowingFilter === opt.key ? 'btn-primary' : ''"
                                  @click="foreshadowingFilter = opt.key"
                                  x-text="`${opt.label} (${opt.count})`"></button>
                        </template>
                      </div>
                    </div>

                    <!--
                      🤖 AI 生成的伏笔（来自 bootstrapData.foreshadowings.by_period）
                      按“短/中/长周期”分组，每条伏笔含 title/content/suggested_plant_chapter
                      等字段。用户手动添加的伏笔另存 DB，二者并列展示。
                    -->
                    <template x-if="bootstrapAiForeshadowings()">
                      <div class="ai-preview-block" style="margin-bottom:12px">
                        <div class="ai-preview-header">
                          <span>🤖 AI 生成伏笔</span>
                          <span class="ai-preview-hint" x-text="`按周期分组`"></span>
                        </div>
                        <template x-for="(items, period) in bootstrapAiForeshadowings()" :key="'ai-fs-' + period">
                          <div style="margin-top:10px">
                            <h4 style="margin:6px 0;font-size:13px;color:#6d28d9">
                              ⏱️ <span x-text="period"></span>
                              <span style="font-weight:normal;color:#8b5cf6" x-text="`（${items.length} 条）`"></span>
                            </h4>
                            <template x-for="(fs, idx) in items" :key="'ai-fs-item-' + period + '-' + idx">
                              <div class="foreshadowing-card status-active" style="border-left:3px solid #8b5cf6;position:relative">
                                <span style="position:absolute;top:8px;right:8px;font-size:10px;font-weight:600;color:#6d28d9;background:#ede9fe;padding:2px 6px;border-radius:4px">AI</span>
                                <div class="fs-header">
                                  <span class="fs-title" x-text="fs.title || '未命名伏笔'"></span>
                                  <span class="fs-status badge-active" x-text="fs.type || period"></span>
                                </div>
                                <div class="fs-content" x-text="fs.content || '暂无内容'"></div>
                                <div style="font-size:11px;color:#6d28d9;margin-top:6px">
                                  建议埋设: 第 <span x-text="fs.suggested_plant_chapter || '?'"></span> 章
                                  <template x-if="fs.suggested_resolve_chapter">
                                    ｜ 建议回收: 第 <span x-text="fs.suggested_resolve_chapter"></span> 章
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>

                    <div class="foreshadowing-list">
                      <template x-for="f in filteredForeshadowings" :key="f.id">
                        <div class="foreshadowing-card" :class="`status-${f.status}`">
                          <div class="fs-header">
                            <span class="fs-title" x-text="f.title"></span>
                            <span class="fs-status" :class="`badge-${f.status}`" x-text="f.status === 'active' ? '进行中' : f.status === 'resolved' ? '已回收' : f.status === 'planted' ? '待开始' : '已废弃'"></span>
                          </div>
                          <div class="fs-content" x-text="f.content || '暂无内容'"></div>
                          <div class="fs-actions">
                            <button class="btn-small" @click="resolveForeshadowing(f)" x-show="f.status === 'active'">标记回收</button>
                            <button class="btn-small" @click="abandonForeshadowing(f)" x-show="f.status === 'active'">废弃</button>
                          </div>
                        </div>
                      </template>
                      <template x-if="filteredForeshadowings.length === 0 && foreshadowings.length > 0">
                        <div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">
                          没有符合当前筛选条件的伏笔（共 {{ foreshadowings.length }} 条）
                        </div>
                      </template>
                    </div>
                    <template x-if="showForeshadowingForm">
                      <div class="inline-form">
                        <input type="text" x-model="foreshadowingForm.title" placeholder="伏笔标题">
                        <textarea x-model="foreshadowingForm.content" placeholder="伏笔详细内容..."></textarea>
                        <div class="form-actions">
                          <button class="btn-secondary" @click="showForeshadowingForm = false">取消</button>
                          <button class="btn-primary" @click="saveForeshadowing()">保存</button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>

            <!-- ═══ 角色/弧光/关系矩阵面板 ═══ -->
            <template x-if="activePanel === 'character-matrix' && currentProject">
              <div class="panel-page">
                <div class="panel-page-header">
                  <h2>👥 角色与关系</h2>
                  <div class="panel-tabs">
                    <button :class="{ active: subPanel === 'characters' }" @click="subPanel = 'characters'">角色</button>
                    <button :class="{ active: subPanel === 'arcs' }" @click="subPanel = 'arcs'">角色弧光</button>
                    <button :class="{ active: subPanel === 'relations' }" @click="subPanel = 'relations'">关系矩阵</button>
                  </div>
                </div>

                <!-- 角色列表 -->
                <template x-if="subPanel === 'characters'">
                  <div class="panel-section">
                    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                      <button class="btn-primary" @click="showCharacterForm = true">➕ 添加角色</button>
                      <button class="btn-secondary" @click="rerunBootstrapStageFromPanel('stage_3a_protagonist')"
                              :disabled="!currentProject || rerunStageBusy['stage_3a_protagonist']"
                              :title="rerunStageBtnTitle('stage_3a_protagonist')">
                        <span x-show="!rerunStageBusy['stage_3a_protagonist']">🔄 重新生成主角</span>
                        <span x-show="rerunStageBusy['stage_3a_protagonist']">⏳ 生成中...</span>
                      </button>
                      <button class="btn-secondary" @click="rerunBootstrapStageFromPanel('stage_3b_antagonist')"
                              :disabled="!currentProject || rerunStageBusy['stage_3b_antagonist']"
                              :title="rerunStageBtnTitle('stage_3b_antagonist')">
                        <span x-show="!rerunStageBusy['stage_3b_antagonist']">🔄 重新生成反派</span>
                        <span x-show="rerunStageBusy['stage_3b_antagonist']">⏳ 生成中...</span>
                      </button>
                      <button class="btn-secondary" @click="rerunBootstrapStageFromPanel('stage_3c_supporting')"
                              :disabled="!currentProject || rerunStageBusy['stage_3c_supporting']"
                              :title="rerunStageBtnTitle('stage_3c_supporting')">
                        <span x-show="!rerunStageBusy['stage_3c_supporting']">🔄 重新生成配角</span>
                        <span x-show="rerunStageBusy['stage_3c_supporting']">⏳ 生成中...</span>
                      </button>
                    </div>

                    <!-- AI 生成的角色（只读，来自 bootstrapData） -->
                    <template x-if="bootstrapAiCharacters().length > 0">
                      <div class="ai-preview-block">
                        <div class="ai-preview-header">
                          <span>🤖 AI 生成角色</span>
                          <span class="ai-preview-hint" x-text="`共 ${bootstrapAiCharacters().length} 个（主角 / 反派 / 配角）`"></span>
                        </div>
                        <div class="character-grid">
                          <template x-for="(c, idx) in bootstrapAiCharacters()" :key="'ai-' + idx">
                            <div class="character-card-full ai-character-card">
                              <div class="char-header">
                                <span class="char-name" x-text="c.name || '未命名'"></span>
                                <span class="char-role-badge" x-text="c.role || '配角'"></span>
                              </div>
                              <div class="char-desc" x-text="c.description || '暂无描述'"></div>
                              <template x-if="c.profile && Object.keys(c.profile).length > 0">
                                <div class="char-profile">
                                  <template x-for="(val, key) in c.profile" :key="key">
                                    <div class="profile-item"><span class="profile-key" x-text="key"></span>: <span class="profile-val" x-text="val"></span></div>
                                  </template>
                                </div>
                              </template>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>

                    </div>
                    <template x-if="showArcForm">

                        <select x-model="arcForm.arc_type">

                    <template x-if="bootstrapAiRelations().length > 0">
                      <div class="ai-preview-block">
                        <div class="ai-preview-header">
                          <span>🤖 AI 生成关系矩阵</span>
                          <span class="ai-preview-hint" x-text="`共 ${bootstrapAiRelations().length} 条关系`"></span>
                        </div>
                        <div class="relation-matrix">

                            <div class="relation-card ai-relation-card">
                              <div class="rel-names">
                                <span x-text="rel.from || '?'"></span>
                                <span class="rel-arrow">→</span>
                                <span x-text="rel.to || '?'"></span>
                              </div>
                              <div class="rel-type" x-text="rel.type || '未分类'"></div>
                              <div class="rel-desc" x-text="rel.description || ''"></div>

                              <div class="rel-desc" x-text="rel.description || ''"></div>

                                <span x-text="rel.strength + '/10'"></span>
                              </div>

                          </template>

                          </template>

                              <strong x-text="entry.title" style="display:block;margin-bottom:4px"></strong>

            <!-- ═══ 检查面板（一致性 + 评审） ═══ -->

                    <button :class="{ active: subPanel === 'consistency' }" @click="subPanel = 'consistency'">一致性</button>
                    <button :class="{ active: subPanel === 'review' }" @click="subPanel = 'review'">智能评审</button>

                </div>

                <!-- 一致性检查 -->
                <template x-if="subPanel === 'consistency'">

                      <div class="empty-state">

                      </div>
                    </template>
                    <template x-if="consistencyResult">
                      <div class="consistency-result">
                        <div class="consistency-summary" :class="{ 'has-issues': consistencyResult.has_issues }">
                          <span x-text="consistencyResult.has_issues ? '⚠️ 发现 ' + consistencyResult.issues.length + ' 个问题' : '✅ 未发现问题'"></span>

                              <div class="issue-message" x-text="issue.message"></div>
                              <template x-if="issue.chapter">
                                <div class="issue-chapter" x-text="issue.chapter"></div>
                              </template>
                            </div>
                          </template>
                        </div>

                          <div class="consistency-report">
                            <h3>📊 项目综合报告</h3>
                            <div class="report-grid">
                              <div class="report-item"><span>章节数</span><strong x-text="consistencyReport.chapters.total"></strong></div>
                              <div class="report-item"><span>平均字数</span><strong x-text="consistencyReport.chapters.avg_word_count + ' 字'"></strong></div>
                              <div class="report-item"><span>伏笔总数</span><strong x-text="consistencyReport.foreshadowing.total"></strong></div>
                              <div class="report-item"><span>进行中</span><strong x-text="consistencyReport.foreshadowing.active"></strong></div>
                              <div class="report-item"><span>已回收</span><strong x-text="consistencyReport.foreshadowing.resolved"></strong></div>
                              <div class="report-item"><span>角色弧光</span><strong x-text="consistencyReport.character_arc.total"></strong></div>
                              <div class="report-item"><span>稳定</span><strong x-text="consistencyReport.character_arc.stable"></strong></div>
                              <div class="report-item"><span>不稳定</span><strong x-text="consistencyReport.character_arc.unstable"></strong></div>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- 智能评审 -->
                <template x-if="subPanel === 'review'">
                  <div class="panel-section">
                    <template x-if="!activeReviewSession">
                      <div class="review-new">
                        <p>选择评审对象：</p>
                        <div class="review-targets">
                          <template x-for="ch in chapters" :key="ch.id">
                            <div class="review-target-card" @click="startReview(ch)">
                              <span x-text="`${ch.order + 1}. ${ch.title}`"></span>
                              <span class="hint" x-text="`${ch.word_count} 字`"></span>
                            </div>
                          </template>
                        </div>
                      </div>
                    </template>

                    <template x-if="activeReviewSession && !reviewResult">

                          <div class="score-item"><span>去AI味</span><div class="score-bar"><div class="score-fill" :style="`width:${reviewResult.score_ai_removal * 10}%`"></div></div><strong x-text="reviewResult.score_ai_removal.toFixed(1)"></strong></div>
                          <div class="score-item"><span>字数合规</span><div class="score-bar"><div class="score-fill" :style="`width:${reviewResult.score_word_count * 10}%`"></div></div><strong x-text="reviewResult.score_word_count.toFixed(1)"></strong></div>

                          <div class="score-item"><span>主旨契合</span><div class="score-bar"><div class="score-fill" :style="`width:${reviewResult.score_thematic * 10}%`"></div></div><strong x-text="reviewResult.score_thematic.toFixed(1)"></strong></div>

                    </template>
                  </div>
                </template>
              </div>
            </template>

    <!-- ═══ 灵感面板 ═══ -->

      <div class="panel-page">
        <div class="panel-page-header">
          <h2>💡 灵感收集</h2>
          <div class="panel-tabs">
            <button :class="{ active: inspirationSubPanel === 'list' }" @click="inspirationSubPanel = 'list'">全部</button>
            <button :class="{ active: inspirationSubPanel === 'tags' }" @click="inspirationSubPanel = 'tags'">标签</button>
          </div>
        </div>
        <div class="panel-section">
          <!-- 灵感输入 -->
          <div class="inspiration-input">
            <textarea x-model="newInspiration.content" placeholder="记录一个灵感..."></textarea>
            <div class="inspiration-meta">
              <input type="text" x-model="newInspiration.source" placeholder="来源（脑洞/阅读/梦境...）" class="source-input">
              <input type="text" x-model="newInspiration.tagInput" placeholder="标签（逗号分隔）" class="tag-input">
              <button class="btn-primary" @click="saveInspiration()">保存灵感</button>
            </div>
          </div>
          <!-- 灵感列表 -->
          <template x-if="inspirationSubPanel === 'list'">
            <div class="inspiration-list">
              <template x-for="insp in inspirations" :key="insp.id">
                <div class="insp-card">
                  <div class="insp-header">
                    <span class="insp-content" x-text="insp.content"></span>
                    <button class="btn-icon" @click="deleteInspiration(insp.id)">🗑</button>
                  </div>
                  <div class="insp-tags">
                    <template x-for="tag in (insp.tags || [])" :key="tag">
                      <span class="insp-tag" x-text="tag"></span>
                    </template>
                    <span class="insp-source" x-show="insp.source" x-text="insp.source"></span>
                  </div>
                </div>
              </template>
            </div>
          </template>
          <!-- 标签视图 -->
          <template x-if="inspirationSubPanel === 'tags'">
            <div class="tag-cloud">
              <template x-for="tag in allInspirationTags" :key="tag">
                <div class="tag-chip" :class="{ active: selectedTag === tag }" @click="selectedTag = selectedTag === tag ? null : tag">
                  <span x-text="tag"></span>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- ═══ 创意问卷面板 ═══ -->
    <template x-if="activePanel === 'questionnaire'">
      <div class="panel-page questionnaire-page">
        <div class="panel-page-header">
          <h2>🎯 创意问卷</h2>
        </div>
        <!-- 问卷选择/列表 -->
        <template x-if="!activeQuestionnaire">
          <div class="panel-section">
            <button class="btn-primary" @click="createNewQuestionnaire()">➕ 新建问卷</button>
            <div class="q-list">
              <template x-for="q in allQuestionnaires" :key="q.id">
                <div class="q-card" :class="{ done: q.status === 'completed' }" @click="openQuestionnaire(q)">
                  <div class="q-title" x-text="q.title"></div>
                  <div class="q-meta">
                    <span x-text="q.status === 'completed' ? '✅ 已完成' : '📝 进行中'"></span>
                    <span x-show="q.created_project_id" x-text="`→ 已生成项目`"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
        <!-- 问卷进行中 -->
        <template x-if="activeQuestionnaire">
          <div class="q-wizard">
            <div class="q-progress">
              <div class="q-progress-bar" :style="`width: ${(qStep / qQuestions.length) * 100}%`"></div>
            </div>
            <div class="q-step" x-show="qStep < qQuestions.length">
              <div class="q-number" x-text="`${qStep + 1} / ${qQuestions.length}`"></div>
              <div class="q-question" x-text="qQuestions[qStep].question"></div>
              <!-- select 类型 -->
              <template x-if="qQuestions[qStep].type === 'select'">
                <div class="q-options">
                  <template x-for="opt in qQuestions[qStep].options" :key="opt">
                    <div class="q-option" :class="{ selected: qAnswers[qQuestions[qStep].id] === opt }" @click="answerQuestion(qQuestions[qStep].id, opt)">
                      <span x-text="opt"></span>
                    </div>
                  </template>
                </div>
              </template>
              <!-- textarea 类型 -->
              <template x-if="qQuestions[qStep].type === 'textarea'">
                <div class="q-textarea">
                  <textarea x-model="qAnswers[qQuestions[qStep].id]" :placeholder="qQuestions[qStep].placeholder || ''"></textarea>
                </div>
              </template>
              <!-- text 类型 -->
              <template x-if="qQuestions[qStep].type === 'text'">
                <div class="q-text">
                  <input type="text" x-model="qAnswers[qQuestions[qStep].id]" :placeholder="qQuestions[qStep].placeholder || ''">
                </div>
              </template>
              <div class="q-nav">
                <button class="btn-secondary" @click="qStep--" :disabled="qStep === 0">上一步</button>
                <button class="btn-primary" @click="nextQuestion()" x-show="qStep < qQuestions.length - 1">下一步</button>
                <button class="btn-primary" @click="submitQuestionnaire()" x-show="qStep === qQuestions.length - 1">完成问卷</button>
              </div>
            </div>
            <!-- 完成问卷后：创建项目 -->
            <template x-if="qStep === qQuestions.length && activeQuestionnaire">
              <div class="q-done">
                <h3>问卷填写完毕！</h3>
                <p>点击下方按钮，根据问卷创建小说项目</p>
                <button class="btn-primary" @click="buildProjectFromQuestionnaire()">🎯 创建小说项目</button>
                <button class="btn-secondary" @click="activeQuestionnaire = null; qStep = 0">返回问卷列表</button>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- ═══ AI 生成弹窗 ═══ -->
    <template x-if="showGenerateModal">
      <div class="modal-overlay" @click.self="showGenerateModal = false">
        <div class="modal modal-wide">
          <h3>✨ AI 续写</h3>
          <div class="generate-options">
            <div class="gen-option">
              <label>模式</label>
              <select x-model="generateMode">
                <option value="continue">续写</option>
                <option value="polish">润色</option>
                <option value="expand">扩展</option>
              </select>
            </div>
            <div class="gen-option">
              <label>字数</label>
              <select x-model="generateWordCount">
                <option value="500">500字</option>
                <option value="1000">1000字</option>
                <option value="2000">2000字</option>
                <option value="3000">3000字（标准）</option>
              </select>
            </div>
          </div>
          <textarea x-model="generatePrompt" placeholder="描述你想要写的内容...（续写模式请描述接下来应该发生什么）"></textarea>
          <template x-if="generating">
            <p class="hint generating-hint">✍️ AI 正在创作中，请稍候...</p>
          </template>
          <template x-if="!generating && generatedText">
            <div class="generated-result">
              <p>✍️ 生成结果：</p>
              <div class="generated-text" x-text="generatedText"></div>
              <div class="result-actions">
                <button class="btn-primary" @click="insertGenerated()">📥 插入到正文</button>
                <button class="btn-secondary" @click="generatedText = null">重新生成</button>
              </div>
            </div>
          </template>
          <div class="modal-actions">
            <button class="btn-secondary" @click="showGenerateModal = false">关闭</button>
            <button class="btn-primary" @click="generateText()" :disabled="generating || !generatePrompt">✨ 生成</button>
          </div>
        </div>
      </div>
    </template>


    <!-- ═══ 导出正文浮层 ═══ -->
    <template x-if="showExportModal">
      <div class="modal-overlay" @click.self="showExportModal = false">
        <div class="modal" style="max-width:560px">
          <header class="pipeline-header">
            <h3>📤 导出正文</h3>
            <button class="modal-close-x" @click="showExportModal = false">×</button>
          </header>
          <div style="padding:20px">
            <!-- 章节选择 -->
            <div style="margin-bottom:16px">
              <label style="display:block;font-weight:600;margin-bottom:8px">选择章节</label>
              <div style="display:flex;gap:8px;margin-bottom:8px">
                <button class="btn-secondary" style="font-size:12px;padding:4px 8px" @click="selectAllExportChapters()">全选</button>
                <button class="btn-secondary" style="font-size:12px;padding:4px 8px" @click="invertExportChapters()">反选</button>
                <span style="font-size:12px;color:var(--text-muted);line-height:28px">已选 <span x-text="exportChapterIds.length"></span> / <span x-text="chapters.length"></span> 章</span>
              </div>
              <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px">
                <template x-for="ch in chapters" :key="ch.id">
                  <label style="display:flex;align-items:center;gap:8px;padding:6px;cursor:pointer;border-radius:4px:hover" class="export-chapter-item">
                    <input type="checkbox" :checked="exportChapterIds.includes(ch.id)" @change="toggleExportChapter(ch.id)">
                    <span x-text="`${ch.order + 1}. ${ch.title}`"></span>
                    <span style="color:var(--text-muted);font-size:12px" x-text="`${ch.word_count || 0}字`"></span>
                  </label>
                </template>
              </div>
            </div>
            
            <!-- 重新分章 -->
            <div style="margin-bottom:16px">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" x-model="exportRechapter">
                <span style="font-weight:600">重新分章</span>
                <span style="font-size:12px;color:var(--text-muted)">(按段落边界切割，不拆分段落)</span>
              </label>
              <div x-show="exportRechapter" style="margin-top:8px;padding:12px;background:var(--bg);border-radius:6px">
                <label style="display:flex;align-items:center;gap:8px">
                  <span>每章字数：</span>
                  <input type="number" x-model.number="exportWordsPerChapter" min="500" max="50000" step="500" style="width:100px;padding:6px;border:1px solid var(--border);border-radius:4px">
                  <span>字</span>
                </label>
                <span style="font-size:12px;color:var(--text-muted);margin-top:4px;display:block">偏差控制在±10%以内</span>
              </div>
            </div>
            
            
            <!-- 章节独立保存 -->
            <div style="margin-bottom:16px">
              <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
                <input type="checkbox" x-model="exportSaveIndividual">
                <span style="font-weight:600">章节独立保存</span>
                <span style="font-size:12px;color:var(--text-muted)">(每章一个文件，打包为 .zip 下载)</span>
              </label>
            </div>
            
            <!-- 导出格式 -->
            <div style="margin-bottom:20px">
              <label style="display:block;font-weight:600;margin-bottom:8px">导出格式</label>
              <div style="display:flex;gap:12px">
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                  <input type="radio" value="txt" x-model="exportFormat">
                  <span>TXT 纯文本</span>
                </label>
                <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
                  <input type="radio" value="markdown" x-model="exportFormat">
                  <span>Markdown</span>
                </label>
              </div>
            </div>
            
            <!-- 操作按钮 -->
            <div style="display:flex;justify-content:flex-end;gap:8px">
              <button class="btn-secondary" @click="showExportModal = false">取消</button>
              <button class="btn-primary" @click="doExport()">📥 导出下载</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 一键生成设置浮层 ═══ -->
    <template x-if="showPipelineSetupModal">
      <div class="modal-overlay" @click.self="showPipelineSetupModal = false">
        <div class="modal" style="max-width:480px">
          <header class="pipeline-header">
            <h3>🤖 一键生成章节</h3>
            <button class="modal-close-x" @click="showPipelineSetupModal = false">×</button>
          </header>
          <div style="padding:20px">
            <div style="margin-bottom:16px">
              <label style="display:block;font-weight:600;margin-bottom:6px">生成章节</label>
              <div style="display:flex;align-items:center;gap:8px">
                <span>第</span>
                <input type="number" x-model.number="pipelineSetupChapter" min="1"
                       style="width:80px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:15px;text-align:center">
                <span>章</span>
                <span style="color:var(--text-muted);font-size:13px;margin-left:8px">（当前共 <span x-text="chapters.length"></span> 章）</span>
              </div>
            </div>
            <div style="margin-bottom:20px">
              <label style="display:block;font-weight:600;margin-bottom:6px">内容引导 <span style="font-weight:400;color:var(--text-muted)">（选填）</span></label>
              <textarea x-model="pipelineSetupGuide" rows="4" placeholder="输入一段文字，用于引导本章情节走向..."
                        style="width:100%;padding:10px;border:1px solid var(--border);border-radius:6px;font-size:14px;resize:vertical"></textarea>

          </div>

    <!-- ═══ 批量生成配置弹窗 ═══ -->
    <template x-if="showBatchGenerateModal">
      <div class="modal-overlay" @click.self="showBatchGenerateModal = false">
        <div class="modal" style="max-width:500px">
          <header class="pipeline-header">
            <h3>📦 批量生成章节</h3>
            <button class="modal-close-x" @click="showBatchGenerateModal = false">×</button>
          </header>
          <div style="padding:20px">
            <div style="margin-bottom:16px">
              <label style="display:block;font-weight:600;margin-bottom:6px">起始位置</label>
              <div style="display:flex;align-items:center;gap:8px">
                <span>从第</span>
                <input type="number" x-model.number="batchGenerateStart" min="0"
                       style="width:80px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:15px;text-align:center">
                <span>章之后开始</span>
                <span style="color:var(--text-muted);font-size:13px;margin-left:8px">
                  （即从第 <strong x-text="batchGenerateStart + 1"></strong> 章起）
                </span>
              </div>

              </p>
            </div>
            <div style="margin-bottom:16px">
              <label style="display:block;font-weight:600;margin-bottom:6px">生成数量</label>
              <div style="display:flex;align-items:center;gap:8px">
                <input type="number" x-model.number="batchGenerateCount" min="1" max="100"
                       style="width:80px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:15px;text-align:center">
                <span>章</span>
                <span style="color:var(--text-muted);font-size:13px;margin-left:8px">
                  → 到第 <strong x-text="batchGenerateStart + batchGenerateCount"></strong> 章
                </span>
              </div>
            </div>
            <div style="margin-bottom:20px">
              <label style="display:block;font-weight:600;margin-bottom:6px">内容引导 <span style="font-weight:400;color:var(--text-muted)">（选填）</span></label>
              <textarea x-model="batchGenerateGuide" rows="3"
                        placeholder="对这几章内容的总体引导，如：主角进入秘境修炼，遇到各种挑战..."
                        style="width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:14px;resize:vertical"></textarea>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:8px">

            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 批量生成进度面板（浮动在右下角） ═══ -->
    <template x-if="batchGenerating && batchProgressInfo">
      <div class="batch-progress-panel" style="">
        <header style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:#f8fafc;border-radius:12px 12px 0 0;">
          <div>
            <strong>📦 批量生成</strong>
            <span style="font-size:13px;color:var(--text-muted);margin-left:8px"
                  x-text="'第 ' + batchProgressInfo.currentOrder + ' 章 (' + (batchProgressInfo.currentIndex + 1) + '/' + batchProgressInfo.total + ')'"></span>
          </div>
          <button class="btn-icon" @click="cancelBatchGenerate()" title="关闭面板" style="font-size:16px">✕</button>
        </header>
        <div style="padding:14px 16px">
          <!-- 总体进度条 -->
          <div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
              <span>总体进度</span>
              <span x-text="batchProgressInfo.completed + '/' + batchProgressInfo.total + ' 章'"></span>
            </div>
            <div style="height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden">
              <div class="batch-progress-bar-inside" style=""
                   :style="'width:' + (batchProgressInfo.total > 0 ? (batchProgressInfo.completed / batchProgressInfo.total * 100) : 0) + '%'"></div>
            </div>
          </div>

          <!-- 已完成章节列表 -->
          <div style="max-height:120px;overflow-y:auto;margin-bottom:12px">
            <template x-for="(info, chNum) in batchProgressInfo.chaptersStatus" :key="chNum">
              <div style="display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px">
                <span x-text="'第' + chNum + '章'" style="min-width:50px"></span>
                <span x-show="info.status === 'running'" style="color:#3b82f6">⏳ 生成中...</span>
                <span x-show="info.status === 'completed'" style="color:#10b981">
                  ✅ <span x-text="(info.word_count || 0) + '字'"></span>
                </span>
                <span x-show="info.status === 'failed'" style="color:#ef4444">❌ 失败</span>
              </div>
            </template>
          </div>

          <!-- 当前章节 9 步流水线进度 -->
          <div style="border-top:1px solid var(--border);padding-top:10px">
            <div style="font-size:13px;font-weight:600;margin-bottom:8px"
                 x-text="'第 ' + batchProgressInfo.currentOrder + ' 章流水线'"></div>
            <div style="display:flex;flex-direction:column;gap:4px">
              <template x-for="s in batchPipelineStagesView" :key="s.id">
                <div style="display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0"
                     :style="s.status === 'running' ? 'color:#3b82f6;font-weight:600' : s.status === 'completed' ? 'color:#10b981' : s.status === 'failed' ? 'color:#ef4444' : 'color:#9ca3af'">
                  <span x-text="s.status === 'completed' ? '✅' : s.status === 'running' ? '⏳' : s.status === 'failed' ? '❌' : '⬜'" style="font-size:11px"></span>
                  <span x-text="s.label"></span>
                  <span x-show="s.duration_ms" style="margin-left:auto;color:#9ca3af"
                        x-text="(s.duration_ms / 1000).toFixed(1) + 's'"></span>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ═══ 修订确认浮层 ═══ -->

        <div class="modal" style="max-width:460px">

            <button class="modal-close-x" @click="showReviseConfirmModal = false">×</button>
