<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CozyWriter - 创作助手</title>
  <link rel="stylesheet" href="/static/css/style.css?v=21">
  <!-- 路由调度器（先于页面 JS 加载，提供 window.registerPageTemplate） -->
  <script src="/static/js/app.js?v=51"></script>
  <!-- 页面 JS（在 alpine:init 中注册 Alpine.data，并注册 HTML 模板） -->
  <script src="/static/js/pages/project_list.js?v=2"></script>
  <script src="/static/js/pages/questionnaire.js?v=2"></script>
  <script src="/static/js/pages/novel_editor.js?v=4"></script>
  <script src="/static/js/pages/script_editor.js?v=4"></script>
  <script src="/static/js/pages/project_settings.js?v=2"></script>
  <script src="/static/js/pages/global_settings.js?v=2"></script>
  <!-- 组件 JS：在页面 JS 之后加载。页面模板里只放 @component 占位注释，
       由 app.js 的 expandComponentTemplates 在挂载时惰性替换，故与加载顺序无关 -->
  <script src="/static/js/components/character_panel.js?v=2"></script>
  <script src="/static/js/components/storyboard_panel.js?v=2"></script>
  <script src="/static/js/components/property_panel.js?v=2"></script>
  <!-- Alpine.js（defer，最后加载；本架构在 alpine:init/initialized 事件中接管） -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
  <div id="app" x-data>
    <!-- 顶部导航 -->
    <nav class="top-nav">
      <div class="nav-brand" @click="$store.app.navigate('/')">
        <span class="brand-icon">✍️</span>
        <span class="brand-text">CozyWriter</span>
      </div>
      <div class="nav-links">
        <button class="nav-link" @click="$store.app.navigate('/')">🏠 项目</button>
        <button class="nav-link" @click="$store.app.navigate('/settings')">⚙️ 设置</button>
      </div>
      <div class="nav-right">
        <template x-for="(crumb, idx) in $store.app.breadcrumbs" :key="idx">
          <span class="breadcrumb" x-text="crumb.label" @click="$store.app.navigate(crumb.path)"></span>
        </template>
      </div>
    </nav>

    <!-- Toast 通知（监听全局 cozywriter:toast 事件） -->
    <div class="toast-container" x-data="toastContainer" x-on:cozywriter:toast.window="showToast($event.detail)">
      <template x-if="toast.visible">
        <div class="toast" :class="'toast-' + toast.type" x-text="toast.message"></div>
      </template>
    </div>

    <!-- 路由出口：各页面 HTML 模板由 app.js mountPage 注入到此容器 -->
    <main id="route-view" class="route-view"></main>
  </div>

  <script>
    // Toast 通知组件
    document.addEventListener('alpine:init', () => {
      Alpine.data('toastContainer', () => ({
        toast: { visible: false, message: '', type: 'info' },
        _timer: null,
        showToast({ message, type = 'info', duration = 3000 }) {
          this.toast = { visible: true, message, type };
          clearTimeout(this._timer);
          this._timer = setTimeout(() => { this.toast.visible = false; }, duration);
        }
      }));
    });
  </script>
</body>
</html>
